<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - FashionStore</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-color: #FF6B9D; --secondary-color: #C44569; --bg-light: #fcfcfc; --dark-text: #2C3E50; }
        body { background-color: #FFF9F9 !important; padding-top: 80px; font-family: 'Poppins', sans-serif; color: var(--dark-text); }

        /* Navbar Styles */
        .navbar {
            background: rgba(255, 255, 255, 0.98);
            padding: 1rem 0;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            color: var(--dark-text);
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
            padding: 0.5rem 1rem;
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        .nav-icons {
            display: flex;
            gap: 1.2rem;
            align-items: center;
        }

        .nav-icon {
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--dark-text);
        }

        .nav-icon:hover {
            color: var(--primary-color);
            transform: scale(1.1);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Mega Dropdown */
        .nav-item {
            position: relative;
        }

        .mega-dropdown {
            position: absolute;
            top: 100%;
            left: -200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 2rem;
            min-width: 600px;
            display: none;
            z-index: 1000;
        }

        .nav-item:hover .mega-dropdown {
            display: block;
        }

        .page-title { font-family: 'Playfair Display', serif; font-weight: 700; text-align: center; margin-bottom: 2rem; }
        .checkout-box { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: 1px solid #f1f1f1; margin-bottom: 20px; }
        .section-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid #eee; }
        .form-control { border-radius: 10px; padding: 12px 15px; border: 1px solid #e0e0e0; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(255, 107, 157, 0.25); }

        /* Custom Radio */
        .shipping-payment-options label { width: 100%; cursor: pointer; margin-bottom: 0px; }
        .custom-radio-card { 
            border: 2px solid #eef0f2; 
            border-radius: 15px; 
            padding: 18px 20px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            width: 100%;
            background-color: #fff;
        }
        .custom-radio-card:hover { border-color: #ffdce8; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .form-check-input:checked + .custom-radio-card { 
            border-color: var(--primary-color); 
            background-color: #fffafc; 
            box-shadow: 0 8px 15px rgba(255, 107, 157, 0.12); 
        }
        .form-check-input { display: none; }
        .radio-circle { width: 22px; height: 22px; border: 2px solid #ddd; border-radius: 50%; display: inline-block; position: relative; flex-shrink: 0; transition: all 0.3s; }
        .form-check-input:checked + .custom-radio-card .radio-circle { border-color: var(--primary-color); }
        .form-check-input:checked + .custom-radio-card .radio-circle::after { 
            content: ''; width: 12px; height: 12px; background: var(--primary-color); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        }
        .custom-radio-card .content-wrapper { flex: 1; min-height: 48px; display: flex; flex-direction: column; justify-content: center; }

        .order-summary-box { position: sticky; top: 100px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #eee; font-weight: 700; font-size: 1.2rem; color: var(--primary-color); }

        .btn-checkout { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; transition: all 0.3s; margin-top: 20px;}
        .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 107, 157, 0.3); }
        .product-mini-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }

        /* Address Display Styles */
        .address-display-section { margin-top: 10px; }
        .current-address-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .current-address-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(255, 107, 157, 0.1);
        }
        .address-content {
            display: flex;
            align-items: center;
            flex: 1;
        }
        .address-text {
            font-size: 0.95rem;
            color: #333;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mb-5">
    <h2 class="page-title">Thanh Toán</h2>

    <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success mb-4" th:text="${successMessage}"></div>

    <div class="row">
        <div class="col-lg-8">
            <form id="checkoutForm" th:action="@{/order/checkout/place-order}" method="POST">
                <div class="checkout-box">
                    <h4 class="section-title"><i class="bi bi-geo-alt me-2"></i>Thông Tin Giao Hàng</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Họ và Tên <span class="text-danger">*</span></label>
                            <input type="text" name="fullName" th:value="${fullName}" class="form-control">
                            <small class="text-danger" th:if="${errorFullName}" th:text="${errorFullName}"></small>
                        </div>

                        <div class="col-md-6">
                            <label>Số điện thoại <span class="text-danger">*</span></label>
                            <input type="text" name="phone" th:value="${phone}" class="form-control">
                            <small class="text-danger" th:if="${errorPhone}" th:text="${errorPhone}"></small>
                        </div>

                        <div class="col-12">
                            <label>Địa chỉ nhận hàng <span class="text-danger">*</span></label>
                            <div class="address-display-section">
                                <div class="current-address-card">
                                    <div class="address-content">
                                        <i class="bi bi-geo-alt-fill me-2" th:classappend="${address != null and !#strings.isEmpty(address)} ? 'text-primary' : 'text-danger'"></i>
                                        <span th:if="${address != null and !#strings.isEmpty(address)}" th:text="${address}" class="address-text"></span>
                                        <span th:unless="${address != null and !#strings.isEmpty(address)}" class="address-text text-danger fw-bold">
                                            Vui lòng cập nhật địa chỉ giao hàng!
                                        </span>
                                    </div>
                                    <a th:href="@{/order/checkout/select-delivery-address}" class="btn btn-outline-primary btn-sm text-decoration-none">
                                        <i class="bi bi-plus-circle me-1" th:if="${address == null or #strings.isEmpty(address)}"></i>
                                        <i class="bi bi-pencil me-1" th:if="${address != null and !#strings.isEmpty(address)}"></i>
                                        <span th:text="${address != null and !#strings.isEmpty(address) ? 'Thay đổi' : 'Thêm địa chỉ'}"></span>
                                    </a>
                                </div>
                                <input type="hidden" name="deliveryAddress" id="deliveryAddress" th:value="${address}" />
                            </div>
                            <small class="text-danger" th:if="${errorAddress}" th:text="${errorAddress}"></small>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted small">Ghi chú cho đơn hàng (Tùy chọn)</label>
                            <textarea class="form-control" name="note" rows="2" placeholder="Giao trong giờ hành chính..." th:text="${note}"></textarea>
                        </div>
                    </div>
                </div>

                <div class="checkout-box">
                    <h4 class="section-title"><i class="bi bi-truck me-2"></i>Phương Thức Giao Hàng</h4>
                    <div class="d-flex flex-column gap-3 shipping-payment-options">
                        <label>
                            <input type="radio" class="form-check-input" name="deliveryMethod" value="standard" 
                                   th:checked="${selectedDeliveryMethod == 'standard'}" onchange="updateTotal(30000)">
                            <div class="custom-radio-card">
                                <div class="radio-circle"></div>
                                <div class="content-wrapper">
                                    <div class="fw-bold">Giao hàng tiêu chuẩn - 30.000đ</div>
                                    <div class="text-muted small">Nhận hàng trong 3-5 ngày làm việc</div>
                                </div>
                            </div>
                        </label>

                        <label>
                            <input type="radio" class="form-check-input" name="deliveryMethod" value="express" 
                                   th:checked="${selectedDeliveryMethod == 'express'}" onchange="updateTotal(50000)">
                            <div class="custom-radio-card">
                                <div class="radio-circle"></div>
                                <div class="content-wrapper">
                                    <div class="fw-bold">Giao hàng hỏa tốc - 50.000đ</div>
                                    <div class="text-muted small">Nhận hàng trong 1-2 ngày làm việc</div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="checkout-box">
                    <h4 class="section-title"><i class="bi bi-wallet2 me-2"></i>Phương Thức Thanh Toán</h4>
                    <div class="d-flex flex-column gap-3 shipping-payment-options">
                        <label>
                            <input type="radio" class="form-check-input" name="paymentMethod" value="COD" 
                                   th:checked="${selectedPaymentMethod == 'COD'}">
                            <div class="custom-radio-card">
                                <div class="radio-circle"></div>
                                <div class="content-wrapper">
                                    <div class="fw-bold">Thanh toán khi nhận hàng (COD)</div>
                                    <div class="text-muted small">Thanh toán bằng tiền mặt khi shipper giao tới</div>
                                </div>
                            </div>
                        </label>

                        <label>
                            <input type="radio" class="form-check-input" name="paymentMethod" value="MOMO" 
                                   th:checked="${selectedPaymentMethod == 'MOMO'}">
                            <div class="custom-radio-card">
                                <div class="radio-circle"></div>
                                <div class="content-wrapper">
                                    <div class="fw-bold">Thanh toán qua Momo</div>
                                    <div class="text-muted small">Quét mã QR hoặc nhập thông tin tài khoản ngân hàng</div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <input type="hidden" name="totalAmount" id="hiddenTotalAmount" th:value="${totalWithShip}">
            </form>
        </div>

        <div class="col-lg-4">
            <div class="checkout-box order-summary-box">
                <h4 class="section-title">Chi Tiết Đơn Hàng</h4>

                <div style="max-height: 400px; overflow-y: auto; margin-bottom: 20px;" class="pe-2">
                    <div class="d-flex gap-3 mb-3 pb-3" th:each="item, iter : ${cartItems}"
                         th:classappend="${iter.last} ? '' : 'border-bottom'"
                         th:if="${item.productVariant != null}">
                        <div style="position: relative; width: 75px; height: 80px; flex-shrink: 0;">
                            <img th:src="${item.productVariant.imageUrl}" class="product-mini-img w-100 h-100" 
                                 onerror="this.src='https://placehold.co/100x100/eeeeee/999999?text=Product'"
                                 style="object-fit: cover; border-radius: 12px; border: 1px solid #f0f0f0;">
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark shadow-sm" 
                                  th:text="${item.quantity}" 
                                  style="font-size: 0.75rem; border: 2px solid white; padding: 4px 8px; z-index: 5;">1</span>
                        </div>
                        <div class="flex-grow-1" style="min-width: 0;">
                            <div class="fw-bold text-dark text-truncate mb-1" style="font-size: 0.95rem;" 
                                 th:text="${item.productVariant.product != null ? item.productVariant.product.productName : 'Sản phẩm FashionStore'}">Tên SP</div>
                            <div class="text-muted small mb-1">
                                <span class="badge bg-light text-dark border fw-normal" th:text="'Size: ' + ${item.productVariant.categorySize != null ? item.productVariant.categorySize.sizeName : 'N/A'}">Size: M</span>
                                <span class="badge bg-light text-dark border fw-normal" th:text="'Màu: ' + ${item.productVariant.color != null ? item.productVariant.color.colorName : 'N/A'}">Màu: Đen</span>
                            </div>
                            <div class="fw-bold text-primary" 
                                 th:text="${#numbers.formatDecimal((item.productVariant.price != null ? item.productVariant.price : 0) * (item.quantity != null ? item.quantity : 1), 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</div>
                        </div>
                    </div>
                </div>

                <!-- Voucher Section -->
                <div class="voucher-container pt-3 border-top">
                    <label class="form-label fw-bold small text-muted"><i class="bi bi-ticket-perforated me-2"></i>MÃ GIẢM GIÁ</label>
                    <form th:action="@{/order/apply-voucher}" method="post" id="voucherForm">
                        <input type="hidden" name="deliveryMethod" id="voucherDeliveryMethod">
                        <input type="hidden" name="paymentMethod" id="voucherPaymentMethod">
                        <div class="input-group mb-2 shadow-sm" style="border-radius: 12px; overflow: hidden;">
                            <input list="voucherList" id="voucherInput" name="voucherCode" class="form-control border-0 py-2 px-3" 
                                   th:value="${appliedVoucher != null ? appliedVoucher.code : ''}"
                                   placeholder="Chọn mã từ danh sách hoặc nhập mã của bạn..." 
                                   style="font-size: 0.9rem; background: #f8f9fa;">
                            
                            <!-- Danh sách gợi ý từ Database -->
                            <datalist id="voucherList">
                                <option th:each="voucher : ${validVouchers}"
                                        th:value="${voucher.code}"
                                        th:label="${'Giảm ' + #numbers.formatDecimal(voucher.discountValue, 0, 'COMMA', 0, 'POINT') + 'đ'}">
                                </option>
                            </datalist>

                            <button type="submit" id="applyVoucherBtn" class="btn btn-dark px-4" 
                                    style="font-weight: 600; border: none;">Áp dụng</button>
                        </div>
                        
                        <!-- Hiển thị khi đã áp dụng thành công -->
                        <div th:if="${appliedVoucher != null}" 
                             class="d-flex align-items-center justify-content-between p-2 mt-2"
                             style="background-color: #f0fff4; border: 1px solid #c6f6d5; border-radius: 8px;">
                           <span class="small text-success fw-bold">
                               <i class="bi bi-check-circle-fill me-1"></i> 
                               Đã áp dụng: <span th:text="${appliedVoucher.code}"></span> 
                               (-<span th:text="${#numbers.formatDecimal(appliedVoucher.discountValue, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>)
                           </span>
                           <a th:href="@{/order/apply-voucher(voucherCode='')}" 
                              class="text-danger small text-decoration-none fw-bold" 
                              style="font-size: 0.8rem;">Gỡ bỏ</a>
                        </div>
                    </form>
                </div>

                <hr class="my-4 text-muted opacity-25">



                <div class="summary-item">
                    <span class="text-muted">Tạm tính:</span>
                    <span class="fw-bold" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                </div>

                <div class="summary-item">
                    <span class="text-muted">Phí vận chuyển:</span>
                    <span class="fw-bold" id="displayShippingFee" th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT')} + 'đ'">30.000đ</span>
                </div>

                <div class="summary-item mb-2" th:if="${discountAmount != null and discountAmount > 0 and appliedVoucher != null}">
                    <span class="text-muted">Giảm giá (<span th:text="${appliedVoucher != null ? appliedVoucher.code : 'Mã'}"></span>):</span>
                    <span class="fw-bold text-danger" th:text="'-' + ${#numbers.formatDecimal(discountAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'">-0đ</span>
                </div>

                <div class="summary-total mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                    <span class="text-dark fw-bold">Tổng thanh toán:</span>
                    <span id="displayTotalAmount" style="font-size: 1.4rem; color: var(--primary-color); font-weight: 800;"
                          th:text="${#numbers.formatDecimal(totalWithShip, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                </div>

                <button type="submit" form="checkoutForm" class="btn-checkout mt-4 shadow-sm" 
                        th:disabled="${address == null or #strings.isEmpty(address)}"
                        th:style="${address == null or #strings.isEmpty(address)} ? 'background: #bdc3c7; cursor: not-allowed; opacity: 0.7;' : 'background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; color: white;'">
                    <span th:if="${address == null or #strings.isEmpty(address)}">VUI LÒNG THÊM ĐỊA CHỈ</span>
                    <span th:unless="${address == null or #strings.isEmpty(address)}">ĐẶT HÀNG NGAY</span>
                </button>
                <div class="text-center mt-3">
                    <a th:href="@{/cart}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Quay lại giỏ hàng</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    // Lấy giá trị tiền sau khi đã trừ voucher từ Server (chưa cộng phí ship)
    const serverFinalTotal = /*[[${finalTotal}]]*/ 0;

    // JavaScript chỉ dùng để cộng phí ship (30k hoặc 50k) khi khách bấm nút Radio
    function updateTotal(shippingFee) {
        // 1. Cập nhật UI tiền ship
        document.getElementById('displayShippingFee').textContent = shippingFee.toLocaleString('vi-VN') + 'đ';

        // 2. Tính lại tổng tiền
        const finalPriceWithShip = serverFinalTotal + shippingFee;
        const safeTotal = Math.max(0, finalPriceWithShip);

        // 3. Cập nhật UI tổng tiền
        document.getElementById('displayTotalAmount').textContent = safeTotal.toLocaleString('vi-VN') + 'đ';
        
        // 4. Cập nhật hidden input để gửi lên server
        document.getElementById('hiddenTotalAmount').value = safeTotal;
    }

// Form validation before submit
document.addEventListener('DOMContentLoaded', function() {
    // 1. Sync voucher form with other selections
    const voucherForm = document.getElementById('voucherForm');
    if (voucherForm) {
        voucherForm.addEventListener('submit', function() {
            const currentDelivery = document.querySelector('input[name="deliveryMethod"]:checked');
            const currentPayment = document.querySelector('input[name="paymentMethod"]:checked');
            
            if (currentDelivery) document.getElementById('voucherDeliveryMethod').value = currentDelivery.value;
            if (currentPayment) document.getElementById('voucherPaymentMethod').value = currentPayment.value;
        });
    }

    const form = document.getElementById('checkoutForm');
    if (form) {
        form.addEventListener('submit', function(e) {
            console.log('Form submitting...');
            
            // Kiểm tra các trường bắt buộc
            const fullName = document.querySelector('input[name="fullName"]').value.trim();
            const phone = document.querySelector('input[name="phone"]').value.trim();
            const deliveryAddress = document.querySelector('input[name="deliveryAddress"]').value.trim();
            
            console.log('Form data:', { fullName, phone, deliveryAddress });
            
            // Validation cơ bản
            if (!fullName) {
                e.preventDefault();
                alert('Vui lòng nhập họ và tên!');
                return false;
            }
            
            if (!phone) {
                e.preventDefault();
                alert('Vui lòng nhập số điện thoại!');
                return false;
            }
            
            if (!deliveryAddress) {
                e.preventDefault();
                alert('Vui lòng chọn địa chỉ giao hàng!');
                return false;
            }
            
            // Check payment method
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked');
            if (!paymentMethod) {
                e.preventDefault();
                alert('Vui lòng chọn phương thức thanh toán!');
                return false;
            }
            
            console.log('Payment method:', paymentMethod.value);
            console.log('Form validation passed, submitting...');
            return true;
        });
    }
});



</script>

</body>
</html>
