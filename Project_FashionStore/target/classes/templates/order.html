<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng - FashionStore</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Common Styles -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #C44569;
            --dark-text: #2C3E50;
            --light-bg: #FFF9F9;
        }
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark-text);
            background-color: var(--light-bg);
            padding-top: 80px;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            padding: 1rem 0;
        }
        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-link { color: var(--dark-text); font-weight: 500; margin: 0 0.5rem; transition: all 0.3s ease; }
        .nav-link:hover { color: var(--primary-color); }
        .nav-icon { font-size: 1.3rem; color: var(--dark-text); transition: all 0.3s ease; cursor: pointer; }
        .nav-icon:hover { color: var(--primary-color); transform: scale(1.1); }
        .order-section { padding: 3rem 0; }
        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
        }
        .page-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), #FFA07A);
            border-radius: 2px;
        }
        .order-form, .order-summary {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--dark-text);
        }
        .form-label { font-weight: 500; }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.8rem;
            border: 2px solid #eee;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 157, 0.25);
        }
        .payment-method {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .payment-method:hover, .payment-method.active {
            border-color: var(--primary-color);
            background: rgba(255, 107, 157, 0.05);
        }
        .order-item {
            display: flex;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
        }
        .order-item:last-child { border-bottom: none; }
        .order-item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 1rem;
        }
        .order-item-name { font-weight: 600; margin-bottom: 0.3rem; }
        .order-item-price { color: var(--primary-color); font-weight: 600; }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }
        .summary-row:last-child {
            border-bottom: none;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        .place-order-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 1rem;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
        }
        .place-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 157, 0.3);
        }
        .footer {
            background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
            color: white;
            padding: 4rem 0 2rem;
            margin-top: 3rem;
        }
        .footer-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; }
        .footer-links { list-style: none; padding: 0; }
        .footer-links li { margin-bottom: 0.8rem; }
        .footer-links a { color: rgba(255, 255, 255, 0.8); text-decoration: none; transition: all 0.3s ease; }
        .footer-links a:hover { color: var(--primary-color); padding-left: 5px; }
        .social-icons { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .social-icon {
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .social-icon:hover { background: var(--primary-color); transform: translateY(-5px); }
        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 3rem;
            padding-top: 2rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<section class="order-section">
    <div class="container">
        <h1 class="page-title">Đặt Hàng</h1>
        <div class="row">
            <div class="col-lg-7">
                <div class="order-form">
                    <h2 class="section-title">Thông Tin Giao Hàng</h2>
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Họ và tên *</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Số điện thoại *</label>
                                <input type="tel" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control">
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Tỉnh/Thành phố *</label>
                                <select class="form-select" required>
                                    <option value="">Chọn tỉnh/thành</option>
                                    <option>Hà Nội</option>
                                    <option>TP. Hồ Chí Minh</option>
                                    <option>Đà Nẵng</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Quận/Huyện *</label>
                                <select class="form-select" required>
                                    <option value="">Chọn quận/huyện</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Phường/Xã *</label>
                                <select class="form-select" required>
                                    <option value="">Chọn phường/xã</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ cụ thể *</label>
                            <input type="text" class="form-control" placeholder="Số nhà, tên đường..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ghi chú</label>
                            <textarea class="form-control" rows="3" placeholder="Ghi chú về đơn hàng..."></textarea>
                        </div>
                    </form>
                </div>

                <div class="order-form">
                    <h2 class="section-title">Phương Thức Thanh Toán</h2>
                    <div class="payment-method active">
                        <input type="radio" name="payment" id="cod" checked>
                        <label for="cod" class="ms-2">
                            <i class="bi bi-cash-coin"></i> Thanh toán khi nhận hàng (COD)
                        </label>
                    </div>
                    <div class="payment-method">
                        <input type="radio" name="payment" id="bank">
                        <label for="bank" class="ms-2">
                            <i class="bi bi-bank"></i> Chuyển khoản ngân hàng
                        </label>
                    </div>
                    <div class="payment-method">
                        <input type="radio" name="payment" id="momo">
                        <label for="momo" class="ms-2">
                            <i class="bi bi-wallet2"></i> Ví điện tử (MoMo, ZaloPay)
                        </label>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="order-summary">
                    <h2 class="section-title">Đơn Hàng Của Bạn</h2>
                    <div class="order-item">
                        <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=150" class="order-item-image">
                        <div class="flex-grow-1">
                            <div class="order-item-name">Áo Thun Basic Trắng</div>
                            <div class="text-muted">Size: M | Số lượng: 1</div>
                            <div class="order-item-price">299.000đ</div>
                        </div>
                    </div>
                    <div class="order-item">
                        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=150" class="order-item-image">
                        <div class="flex-grow-1">
                            <div class="order-item-name">Áo Hoodie Oversize</div>
                            <div class="text-muted">Size: L | Số lượng: 2</div>
                            <div class="order-item-price">998.000đ</div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="summary-row">
                            <span>Tạm tính:</span>
                            <span>1.297.000đ</span>
                        </div>
                        <div class="summary-row">
                            <span>Phí vận chuyển:</span>
                            <span>30.000đ</span>
                        </div>
                        <div class="summary-row">
                            <span>Giảm giá:</span>
                            <span class="text-success">-50.000đ</span>
                        </div>
                        <div class="summary-row">
                            <span>Tổng cộng:</span>
                            <span>1.277.000đ</span>
                        </div>
                    </div>

                    <a href="/fashionstore/orderdetails" class="place-order-btn" style="text-decoration: none; display: block; text-align: center;">
                        <i class="bi bi-check-circle me-2"></i>Đặt Hàng
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
