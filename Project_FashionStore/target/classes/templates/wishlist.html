<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - FashionStore</title>
    
    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Common Styles -->
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Common Styles -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        body {
            background-color: #FFF5F7;
            padding-top: 80px;
        }
        
        .main-content {
            padding: 40px 0;
            min-height: 70vh;
        }
        
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            color: #2F2F2F;
            font-size: 2rem;
        }
        
        .wishlist-count {
            color: #7A7A7A;
            margin-top: 5px;
        }
        
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .product-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        
        .product-info {
            padding: 20px;
        }
        
        .product-name {
            font-weight: 600;
            color: #2F2F2F;
            margin-bottom: 8px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        
        .product-name:hover {
            color: #F06292;
        }
        
        .product-image {
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #F06292;
            margin-bottom: 15px;
        }
        
        .old-price {
            text-decoration: line-through;
            color: #7A7A7A;
            font-size: 1rem;
            margin-left: 10px;
        }
        
        .btn-remove {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .btn-remove:hover {
            background: #dc3545;
            color: white;
            transform: scale(1.1);
        }
        
        .btn-add-cart {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #F06292 0%, #C44569 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-add-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 98, 146, 0.3);
        }
        
        .empty-wishlist {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-wishlist i {
            font-size: 5rem;
            color: #e0e0e0;
            margin-bottom: 20px;
        }
        
        .empty-wishlist h3 {
            color: #2F2F2F;
            margin-bottom: 10px;
        }
        
        .empty-wishlist p {
            color: #7A7A7A;
            margin-bottom: 20px;
        }
        
        /* Update styles to match pink color scheme */
        .page-header h1 {
            color: #F06292;
        }
        
        .product-price {
            color: #F06292;
        }
        
        .btn-add-cart {
            background: linear-gradient(135deg, #F06292 0%, #C44569 100%);
        }
    </style>
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="container">
        <div class="page-header">
            <h1><i class="bi bi-heart-fill"></i> My Wishlist</h1>
            <p class="wishlist-count">You have 4 items in your wishlist</p>
        </div>

        <div class="wishlist-grid">
            <div class="product-card">
                <button class="btn-remove" onclick="removeFromWishlist(this)"><i class="bi bi-x-lg"></i></button>
                <a href="/fashionstore/product-details">
                    <img src="https://via.placeholder.com/280x300/667eea/ffffff?text=T-Shirt" alt="Product" class="product-image">
                </a>
                <div class="product-info">
                    <a href="/fashionstore/product-details" style="text-decoration: none; color: inherit;">
                        <div class="product-name">Classic White T-Shirt</div>
                    </a>
                    <div class="product-price">$29.99 <span class="old-price">$39.99</span></div>
                    <a href="/fashionstore/order" class="btn-add-cart" style="text-decoration: none; display: block; text-align: center;">
                        <i class="bi bi-bag-check"></i> Mua ngay
                    </a>
                </div>
            </div>

            <div class="product-card">
                <button class="btn-remove" onclick="removeFromWishlist(this)"><i class="bi bi-x-lg"></i></button>
                <a href="/fashionstore/product-details">
                    <img src="https://via.placeholder.com/280x300/f093fb/ffffff?text=Dress" alt="Product" class="product-image">
                </a>
                <div class="product-info">
                    <a href="/fashionstore/product-details" style="text-decoration: none; color: inherit;">
                        <div class="product-name">Summer Floral Dress</div>
                    </a>
                    <div class="product-price">$89.99</div>
                    <button class="btn-add-cart"><i class="bi bi-cart-plus"></i> Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <button class="btn-remove" onclick="removeFromWishlist(this)"><i class="bi bi-x-lg"></i></button>
                <a href="/fashionstore/product-details">
                    <img src="https://via.placeholder.com/280x300/4facfe/ffffff?text=Jeans" alt="Product" class="product-image">
                </a>
                <div class="product-info">
                    <a href="/fashionstore/product-details" style="text-decoration: none; color: inherit;">
                        <div class="product-name">Blue Denim Jeans</div>
                    </a>
                    <div class="product-price">$79.99 <span class="old-price">$99.99</span></div>
                    <button class="btn-add-cart"><i class="bi bi-cart-plus"></i> Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <button class="btn-remove" onclick="removeFromWishlist(this)"><i class="bi bi-x-lg"></i></button>
                <a href="/fashionstore/product-details">
                    <img src="https://via.placeholder.com/280x300/43e97b/ffffff?text=Shoes" alt="Product" class="product-image">
                </a>
                <div class="product-info">
                    <a href="/fashionstore/product-details" style="text-decoration: none; color: inherit;">
                        <div class="product-name">Running Shoes</div>
                    </a>
                    <div class="product-price">$129.99</div>
                    <button class="btn-add-cart"><i class="bi bi-cart-plus"></i> Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Empty State (hidden by default) -->
        <div class="empty-wishlist" style="display: none;" id="emptyState">
            <i class="bi bi-heart"></i>
            <h3>Your Wishlist is Empty</h3>
            <p>Save your favorite items here to buy them later</p>
            <a href="${pageContext.request.contextPath}/products" class="btn btn-primary"><i class="bi bi-shop"></i> Continue Shopping</a>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function removeFromWishlist(button) {
        if(confirm('Bạn có muốn xóa sản phẩm này khỏi danh sách yêu thích?')) {
            const card = button.closest('.product-card');
            card.style.opacity = '0';
            setTimeout(() => {
                card.remove();
                updateWishlistCount();
            }, 300);
        }
    }
    
    function updateWishlistCount() {
        const count = document.querySelectorAll('.product-card').length;
        const countEl = document.querySelector('.wishlist-count');
        if (countEl) {
            countEl.textContent = `You have ${count} items in your wishlist`;
        }
        
        if (count === 0) {
            document.getElementById('emptyState').style.display = 'block';
        }
    }
</script>
</body>
</html>
