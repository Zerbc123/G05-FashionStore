<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Fragment providing a three-tier Vietnam address selector (province/district/ward)
  plus a house/street field. When all parts are chosen the full address is written
  into a hidden input named "address" so existing controllers can continue using
  the same parameter. Bootstrap styles are used for layout. The fragment accepts
  an optional `address` variable containing the currently-saved address string
  (e.g. "123 Nguyễn Trãi, Phường 1, Quận 5, Hồ Chí Minh"). If present the
  selects and house input are prefilled after the province list loads.
-->

<style>
    .address-loading-spinner {
        display: inline-block;
        width: 1em;
        height: 1em;
        border: 2px solid #ccc;
        border-top-color: #FF6B9D;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 0.5em;
        vertical-align: middle;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .address-loading-text {
        display: inline-block;
        color: #666;
        font-size: 0.9rem;
        margin-left: 0.5rem;
    }
    .address-loading-container {
        margin-top: 0.5rem;
        min-height: 1.5rem;
    }
</style>

<div th:fragment="addressSelect(address)">
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Tỉnh/Thành <span class="text-danger">*</span></label>
            <select id="province" name="province" class="form-select" required>
                <option value="">Đang tải tỉnh/thành...</option>
            </select>
            <div class="address-loading-container">
                <div id="provinceLoadingIndicator" class="address-loading-spinner"></div><span class="address-loading-text">Vui lòng chờ tải danh sách...</span>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Quận/Huyện <span class="text-danger">*</span></label>
            <select id="district" name="district" class="form-select" required disabled>
                <option value="">Chọn quận/huyện</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Phường/Xã <span class="text-danger">*</span></label>
            <select id="ward" name="ward" class="form-select" required disabled>
                <option value="">Chọn phường/xã</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Số nhà & đường <span class="text-danger">*</span></label>
            <input type="text" id="house" name="house" class="form-control" placeholder="Số nhà, tên đường" required />
        </div>
        <!-- hidden field for the assembled address -->
        <input type="hidden" id="address" name="address" th:value="${address}" />
    </div>
    <div id="addressError" class="text-danger small mt-2"></div>
</div>

<script th:inline="javascript">
/*<![CDATA[*/
let provincesList = [];
let loadTimeout = null;

function hideLoadingSpinner() {
    const spinner = document.getElementById('provinceLoadingIndicator');
    const text = document.querySelector('.address-loading-text');
    if (spinner) spinner.style.display = 'none';
    if (text) text.style.display = 'none';
}

function showLoadingError(message) {
    hideLoadingSpinner();
    const errDiv = document.getElementById('addressError');
    if (errDiv) {
        errDiv.innerHTML = '<i class="bi bi-exclamation-circle me-1"></i>' + message;
    }
}

function loadProvinces() {
    const provSelect = document.getElementById('province');
    const errDiv = document.getElementById('addressError');

    // 1. try local JSON file (static) first
    // use Thymeleaf to compute a context-relative URL so it works no matter what
    const localJsonUrl = /*[[@{/data/vietnam-address.json}]]*/ 'data/vietnam-address.json';
    console.log('Loading local address JSON from', localJsonUrl);
    fetch(localJsonUrl)
        .then(res => {
            if (!res.ok) throw new Error('no local file');
            return res.json();
        })
        .then(data => {
            provincesList = data;
            hideLoadingSpinner();
            provSelect.innerHTML = '<option value="">Chọn tỉnh/thành</option>';
            data.forEach(p => provSelect.add(new Option(p.name, p.name)));
            if (errDiv) errDiv.innerHTML = '';
            const existing = /*[[${address}]]*/ '';
            if (existing) prefillAddress(existing);
        })
        .catch(err => {
            console.warn('local JSON fetch failed', err);
            // fallback to remote + cache logic
            const cachedData = localStorage.getItem('vietnamProvinces');
            if (cachedData) {
                try {
                    provincesList = JSON.parse(cachedData);
                    hideLoadingSpinner();
                    provSelect.innerHTML = '<option value="">Chọn tỉnh/thành</option>';
                    provincesList.forEach(p => provSelect.add(new Option(p.name, p.name)));
                    if (errDiv) errDiv.innerHTML = '';
                    const existing = /*[[${address}]]*/ '';
                    if (existing) prefillAddress(existing);
                    return;
                } catch (e) {
                    console.warn('Cache corrupted, fetching fresh data', e);
                    localStorage.removeItem('vietnamProvinces');
                }
            }

            loadTimeout = setTimeout(() => {
                showLoadingError('API chậm. Vui lòng <a href="javascript:location.reload()" class="text-danger">tải lại trang</a> hoặc thử lại sau.');
                if (provSelect) provSelect.innerHTML = '<option value="">Không thể tải tỉnh/thành</option>';
            }, 8000);

            fetch('https://provinces.open-api.vn/api/?depth=3')
                .then(res => res.json())
                .then(data => {
                    clearTimeout(loadTimeout);
                    hideLoadingSpinner();
                    try {
                        localStorage.setItem('vietnamProvinces', JSON.stringify(data));
                        localStorage.setItem('vietnamProvincesTime', Date.now().toString());
                    } catch (e) {
                        console.warn('Could not cache to localStorage', e);
                    }
                    provincesList = data;
                    provSelect.innerHTML = '<option value="">Chọn tỉnh/thành</option>';
                    data.forEach(p => provSelect.add(new Option(p.name, p.name)));
                    if (errDiv) errDiv.innerHTML = '';
                    const existing = /*[[${address}]]*/ '';
                    if (existing) prefillAddress(existing);
                })
                .catch(err => {
                    clearTimeout(loadTimeout);
                    console.error('Failed to load provinces', err);
                    if (provSelect) provSelect.innerHTML = '<option value="">Không thể tải tỉnh/thành</option>';
                    showLoadingError('Không thể tải danh sách địa phương. Vui lòng kiểm tra kết nối mạng.');
                });
        });
}

function populateDistricts(provinceName) {
    const prov = provincesList.find(p => p.name === provinceName);
    const distSelect = document.getElementById('district');
    const wardSelect = document.getElementById('ward');
    distSelect.innerHTML = '<option value="">Chọn quận/huyện</option>';
    wardSelect.innerHTML = '<option value="">Chọn phường/xã</option>';
    distSelect.disabled = true;
    wardSelect.disabled = true;
    if (prov && prov.districts) {
        prov.districts.forEach(d => distSelect.add(new Option(d.name, d.name)));
        distSelect.disabled = false;
    }
}

function populateWards(provinceName, districtName) {
    const prov = provincesList.find(p => p.name === provinceName);
    const wardSelect = document.getElementById('ward');
    wardSelect.innerHTML = '<option value="">Chọn phường/xã</option>';
    wardSelect.disabled = true;
    if (prov && prov.districts) {
        const dist = prov.districts.find(d => d.name === districtName);
        if (dist && dist.wards) {
            dist.wards.forEach(w => wardSelect.add(new Option(w.name, w.name)));
            wardSelect.disabled = false;
        }
    }
}

function combineAddress() {
    const house = document.getElementById('house').value.trim();
    const ward = document.getElementById('ward').value;
    const district = document.getElementById('district').value;
    const province = document.getElementById('province').value;
    if (house && ward && district && province) {
        document.getElementById('address').value = house + ', ' + ward + ', ' + district + ', ' + province;
    }
}

function prefillAddress(addr) {
    if (!addr) return;
    const parts = addr.split(',');
    if (parts.length >= 4) {
        const province = parts.pop().trim();
        const district = parts.pop().trim();
        const ward = parts.pop().trim();
        const housePart = parts.join(',').trim();
        document.getElementById('house').value = housePart;
        // wait for provinces to be populated before setting values
        setTimeout(() => {
            document.getElementById('province').value = province;
            populateDistricts(province);
            document.getElementById('district').value = district;
            populateWards(province, district);
            document.getElementById('ward').value = ward;
            combineAddress();
        }, 500);
    }
}

// initialize listeners on DOMContentLoaded / when fragment is inserted
function addressFragmentInit() {
    const provElem = document.getElementById('province');
    if (!provElem) {
        // element not yet in DOM? retry shortly
        setTimeout(addressFragmentInit, 100);
        return;
    }
    loadProvinces();
    provElem.addEventListener('change', function () {
        populateDistricts(this.value);
        combineAddress();
    });
    const distElem = document.getElementById('district');
    const wardElem = document.getElementById('ward');
    if (distElem) {
        distElem.addEventListener('change', function () {
            populateWards(document.getElementById('province').value, this.value);
            combineAddress();
        });
    }
    if (wardElem) {
        wardElem.addEventListener('change', combineAddress);
    }
    const houseElem = document.getElementById('house');
    if (houseElem) {
        houseElem.addEventListener('input', combineAddress);
    }
}

// automatically run when script loads
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addressFragmentInit);
} else {
    addressFragmentInit();
}
/*]]>*/
</script>
