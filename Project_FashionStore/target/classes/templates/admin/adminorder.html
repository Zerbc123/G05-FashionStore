<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng - Admin</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #C44569;
            --dark-text: #2C3E50;
            --light-bg: #FFF9F9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark-text);
            background-color: var(--light-bg);
        }

        .admin-container {
            padding: 2rem 0;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .badge-status {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .badge-confirmed {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .badge-shipping {
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        .badge-completed {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .badge-cancelled {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .badge-refunded {
            background: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }

        .btn-action {
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin: 0 0.2rem;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #6c757d !important;
            border-color: #6c757d !important;
        }
    </style>
</head>

<body>
<!-- Admin Header -->
<div th:replace="~{fragments/header :: adminheader}"></div>

<!-- Main Content với margin-top -->
<div class="admin-container" style="margin-top: 80px;">
    <div class="container mt-4">
        <!-- Success/Error Messages -->
        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>Cập nhật trạng thái đơn hàng thành công!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <h2 class="mb-4">Quản Lý Đơn Hàng</h2>

        <div class="table-card">
            <h3 class="mb-3">Danh Sách Đơn Hàng</h3>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Mã ĐH</th>
                            <th>Khách hàng</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td><strong>#DH[[${order.orderId}]]</strong></td>

                            <td th:text="${order.customer.fullName}"></td>

                            <td th:text="${#dates.format(order.orderDate,'dd/MM/yyyy')}"></td>

                            <td>
                                <strong
                                        th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' đ'"></strong>
                            </td>

                            <td>
                                <span class="badge-status" th:classappend="
                                    ${order.status != null and order.status.name() == 'PENDING'} ? ' badge-pending' :
                                    (${order.status != null and order.status.name() == 'CONFIRMED'} ? ' badge-confirmed' :
                                    (${order.status != null and order.status.name() == 'SHIPPING'} ? ' badge-shipping' :
                                    (${order.status != null and order.status.name() == 'COMPLETED'} ? ' badge-completed' :
                                    (${order.status != null and order.status.name() == 'CANCELLED'} ? ' badge-cancelled' : ' badge-refunded'))))"
                                      th:text="${order.status != null ? order.status.name() : 'UNKNOWN'}">
                                </span>
                            </td>

                            <td>
                                <!-- XEM CHI TIẾT -->
                                <a th:href="@{/admin/orders/orderdetails/{id}(id=${order.orderId})}"
                                   class="btn btn-sm btn-warning btn-action">
                                    <i class="bi bi-eye"></i>
                                </a>

                                <!-- UPDATE STATUS -->
                                <div th:with="isFinalStatus=${order.status != null and (order.status.name() == 'COMPLETED' or order.status.name() == 'CANCELLED' or order.status.name() == 'REFUNDED')}">
                                    <button type="button" class="btn btn-sm btn-primary btn-action"
                                            th:disabled="${isFinalStatus}"
                                            data-bs-toggle="modal" th:data-bs-target="'#updateModal' + ${order.orderId}"
                                            th:title="${isFinalStatus} ? 'Không thể thay đổi trạng thái của đơn hàng đã hoàn thành/bị hủy/hoàn tiền' : 'Cập nhật trạng thái'">
                                        Update
                                    </button>
                                </div>

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL LẶP THEO ORDER -->
<div th:each="order : ${orders}">
    <div class="modal fade" th:id="'updateModal' + ${order.orderId}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Cập nhật trạng thái - ĐH #DH[[${order.orderId}]]
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <form th:action="@{/admin/orders/update-status/{id}(id=${order.orderId})}" method="post">
                    <div class="modal-body">
                        <select name="status" class="form-select">
                            <option value="PENDING" th:selected="${order.status != null and order.status.name() == 'PENDING'}">
                                Chờ xác nhận (PENDING)
                            </option>

                            <option value="CONFIRMED" th:selected="${order.status != null and order.status.name() == 'CONFIRMED'}">
                                Đã xác nhận (CONFIRMED)
                            </option>

                            <option value="SHIPPING" th:selected="${order.status != null and order.status.name() == 'SHIPPING'}">
                                Đang giao hàng (SHIPPING)
                            </option>

                            <option value="COMPLETED" th:selected="${order.status != null and order.status.name() == 'COMPLETED'}">
                                Đã hoàn thành (COMPLETED)
                            </option>

                            <option value="CANCELLED" th:selected="${order.status != null and order.status.name() == 'CANCELLED'}">
                                Đã hủy (CANCELLED)
                            </option>

                            <option value="REFUNDED" th:selected="${order.status != null and order.status.name() == 'REFUNDED'}">
                                Đã hoàn tiền (REFUNDED)
                            </option>
                        </select>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Hủy
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Debug script để kiểm tra modal
document.addEventListener('DOMContentLoaded', function() {
    console.log('Admin order page loaded');
    
    // Kiểm tra tất cả các modal
    const modals = document.querySelectorAll('.modal');
    console.log('Found modals:', modals.length);
    
    // Kiểm tra tất cả các buttons
    const buttons = document.querySelectorAll('[data-bs-toggle="modal"]');
    console.log('Found modal buttons:', buttons.length);
    
    buttons.forEach((button, index) => {
        console.log(`Button ${index}:`, button.getAttribute('data-bs-target'));
    });
    
    // Test mở modal thủ công
    window.testModal = function(orderId) {
        const modal = document.getElementById('updateModal' + orderId);
        if (modal) {
            const bsModal = new bootstrap.Modal(modal);
            bsModal.show();
            console.log('Modal opened for order:', orderId);
        } else {
            console.error('Modal not found for order:', orderId);
        }
    };
});
</script>

</body>
</html>
