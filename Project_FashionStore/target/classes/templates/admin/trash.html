<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionStore Admin - Thùng rác</title>

    <!-- Bootstrap CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#F06292',
                            light: '#F48FB1',
                        },
                        secondary: {
                            bg: '#FFF5F7',
                        },
                        text: {
                            main: '#2F2F2F',
                            muted: '#7A7A7A',
                        },
                        divider: '#EAEAEA',
                        success: '#C8E6C9',
                        danger: '#F8D7DA',
                        warning: '#FFF3CD'
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'serif'],
                        body: ['"Poppins"', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 6px 18px rgba(0,0,0,0.06)',
                    },
                    backgroundImage: {
                        'admin-gradient': 'linear-gradient(90deg, #F06292 0%, #F48FB1 100%)',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F4F7FB !important; color: #2F2F2F; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- Admin Header -->
<div th:replace="~{fragments/header :: adminheader}"></div>

<div style="margin-top: 80px;">

<main class="flex-grow p-8 max-w-[1320px] mx-auto w-full">

    <!-- Error Message Display -->
    <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
        <i class="fa-solid fa-exclamation-triangle"></i>
        <span th:text="${errorMessage}">Error message</span>
    </div>

    <div th:if="${successMessage}"
         class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${successMessage}">Success message</span>
    </div>
    <!-- Page Header Section -->
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-heading font-bold text-text-main flex items-center gap-3">
                <i class="fa-solid fa-trash text-red-500"></i>
                Thùng rác
            </h1>
            <div class="w-12 h-1 bg-primary mt-2"></div>
            <p class="text-text-muted mt-2 text-sm">Danh sách tài khoản nhân viên đã bị xóa</p>
        </div>

        <div class="flex items-center gap-3">
            <form th:action="@{/admin/staff/trash}" method="get" class="relative">
                <input type="text" 
                       name="keyword" 
                       th:value="${keyword}"
                       placeholder="Tìm kiếm nhân viên đã xóa..." 
                       class="pl-10 pr-4 py-2.5 rounded-xl border border-divider focus:outline-none focus:border-primary w-64 text-sm transition shadow-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-text-muted text-xs"></i>
            </form>
            <a th:href="@{/admin/staff}" class="bg-admin-gradient text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-md hover:shadow-lg transition flex items-center gap-2 no-underline">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </a>
        </div>
    </div>

    <!-- Deleted Staff Table Container -->
    <div class="table-container">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="border-b-2 border-primary/20 bg-secondary-bg/30">
                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">Staff ID</th>
                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">Họ tên</th>
                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">Email</th>
                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider text-right">Hành động</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-divider">
            <tr class="hover:bg-secondary-bg/50 transition-colors group" th:each="s : ${deletedStaffPage.content}">
                <td class="px-6 py-4">
                    <span class="font-mono text-xs font-bold text-primary" th:text="${'ACC-' + s.accountId}">ACC-1</span>
                </td>
                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-red-100 flex items-center justify-center text-red-600 font-bold text-xs" th:text="${s.fullName != null and !#strings.isEmpty(s.fullName) ? #strings.substring(s.fullName,0,1) : 'S'}">S</div>
                        <span class="text-sm font-medium text-text-main" th:text="${s.fullName}">Tên nhân viên</span>
                    </div>
                </td>
                <td class="px-6 py-4 text-sm text-text-muted" th:text="${s.email}">email</td>
                <td class="px-6 py-4 text-right space-x-2">
                    <a th:href="@{'/admin/staff/restore/' + ${s.accountId}}" class="px-3 py-1.5 bg-white border border-green-600 text-green-700 text-xs font-bold rounded-lg hover:bg-green-600 hover:text-white transition shadow-sm inline-block no-underline" onclick="return confirm('Xác nhận khôi phục nhân viên này?');">Khôi phục</a>
                    <a th:href="@{'/admin/staff/hard-delete/' + ${s.accountId}}" class="px-3 py-1.5 bg-white border border-red-600 text-red-700 text-xs font-bold rounded-lg hover:bg-red-600 hover:text-white transition shadow-sm inline-block no-underline" onclick="return confirm('CẢNH BÁO: Xóa vĩnh viễn nhân viên này? Hành động này không thể hoàn tác!');">Xóa vĩnh viễn</a>
                </td>
            </tr>
            <tr th:if="${deletedStaffPage.content.isEmpty()}">
                <td colspan="5" class="px-6 py-8 text-center text-text-muted">
                    <div class="flex flex-col items-center gap-3">
                        <i class="fa-solid fa-trash text-4xl text-gray-300"></i>
                        <span class="text-sm">Không có tài khoản nhân viên nào trong thùng rác</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Pagination Section -->
        <div class="px-6 py-5 flex items-center justify-center bg-white" th:if="${!deletedStaffPage.content.isEmpty()}">

            <div class="flex items-center gap-2">
                <!-- Previous -->
                <a th:if="${currentPage > 0}" 
                   th:href="@{/admin/staff/trash(page=${currentPage - 1}, size=${deletedStaffPage.size}, keyword=${keyword})}" 
                   class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted hover:bg-secondary-bg transition no-underline">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </a>
                <button th:unless="${currentPage > 0}" 
                        class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted opacity-50 cursor-not-allowed" 
                        disabled>
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </button>
                
                <!-- Page Numbers -->
                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i != currentPage}" 
                       th:href="@{/admin/staff/trash(page=${i}, size=${deletedStaffPage.size}, keyword=${keyword})}" 
                       class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted hover:bg-secondary-bg transition text-xs font-bold no-underline"
                       th:text="${i + 1}">1</a>
                    <button th:unless="${i != currentPage}" 
                            class="w-8 h-8 rounded-lg flex items-center justify-center bg-primary text-white text-xs font-bold shadow-sm"
                            th:text="${i + 1}">1</button>
                </th:block>
                
                <!-- Next -->
                <a th:if="${currentPage < totalPages - 1}" 
                   th:href="@{/admin/staff/trash(page=${currentPage + 1}, size=${deletedStaffPage.size}, keyword=${keyword})}" 
                   class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted hover:bg-secondary-bg transition no-underline">
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </a>
                <button th:unless="${currentPage < totalPages - 1}" 
                        class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted opacity-50 cursor-not-allowed" 
                        disabled>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>
        </div>
    </div>

</main>

<footer class="py-6 border-t border-divider bg-white text-center mt-auto">
    <p class="text-[10px] text-text-muted font-bold uppercase tracking-widest">FashionStore Admin Console &copy; 2024</p>
</footer>
</div>
</body>
</html>
