<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta th:http-equiv="refresh" th:content="'300;url=' + @{/forgot-password}">
    <title>Reset Password - Fashion Store</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .reset-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .reset-left h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 20px; }
        .reset-right { padding: 60px 40px; }
        .reset-right h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 10px; color: #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
        }
        .form-control:focus { border-color: #667eea; outline: none; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .otp-input {
            text-align: center;
            letter-spacing: 5px;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3;
        }
        .btn-reset:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        .btn-resend {
            width: 100%;
            padding: 11px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-resend:hover:not(:disabled) { background: #f0f2ff; }
        .btn-resend:disabled { opacity: 0.5; cursor: not-allowed; }
        .alert { padding: 12px 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-danger { background: #fee; color: #c33; border: 1px solid #fcc; }
        .alert-success { background: #efe; color: #3c3; border: 1px solid #cfc; }
        .back-link { text-align: center; margin-top: 25px; }
        .back-link a { color: #667eea; text-decoration: none; font-weight: 600; }

        @media (max-width: 768px) {
            .reset-container { grid-template-columns: 1fr; }
            .reset-left { display: none; }
        }
    </style>
</head>
<body>

<div class="reset-container">
    <div class="reset-left">
        <div>
            <h1>Reset Password</h1>
            <p>Enter the OTP code and your new password to complete the reset process.</p>
            <svg class="illustration" viewBox="0 0 500 500" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
                <rect x="150" y="200" width="200" height="120" rx="10" fill="none" stroke="white" stroke-width="10"/>
                <circle cx="250" cy="260" r="20" fill="white"/>
                <path d="M200 320 L300 320" stroke="white" stroke-width="10" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <div class="reset-right">
        <h2>Create New Password</h2>
        <p>Enter OTP and set your new password</p>

        <div style="background: #f8f9ff; border-left: 4px solid #667eea; padding: 10px 15px; margin-bottom: 20px; border-radius: 4px;">
            <small style="color: #555; display: block;">
                <i class="bi bi-clock-history"></i> Mã xác thực có hiệu lực trong <b>5 phút</b>.
            </small>
        </div>

        <div class="alert alert-danger" th:if="${error}">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <div class="alert alert-success" th:if="${success}">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post" id="resetPasswordForm">
            <div class="form-group">
                <label for="otp"><i class="bi bi-shield-check"></i> OTP Code</label>
                <input type="text"
                       class="form-control otp-input"
                       id="otp"
                       name="otp"
                       placeholder="000000"
                       maxlength="6"
                       required
                       oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            </div>

            <div class="form-group">
                <label for="newPassword"><i class="bi bi-lock"></i> New Password</label>
                <input type="password"
                       class="form-control"
                       id="newPassword"
                       name="newPassword"
                       placeholder="Nhập mật khẩu mới"
                       required>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><i class="bi bi-lock-fill"></i> Confirm New Password</label>
                <input type="password"
                       class="form-control"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Xác nhận mật khẩu mới"
                       required>
            </div>

            <button type="submit" class="btn-reset">
                <i class="bi bi-check-circle"></i> Reset Password
            </button>
        </form>

        <!-- Gửi lại OTP -->
        <form th:action="@{/resend-otp}" method="post" style="margin-top: 10px;">
            <button type="submit" class="btn-resend" id="resendBtn">
                <i class="bi bi-arrow-repeat"></i> <span id="resendText">Gửi lại OTP</span>
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/forgot-password}">
                <i class="bi bi-arrow-left"></i> Back to Forgot Password
            </a>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // ===== COUNTDOWN cho nút Gửi lại OTP =====
    (function() {
        const lastOtpTime = /*[[${lastOtpTime}]]*/ 0;
        const otpCount    = /*[[${otpCount}]]*/ 1;
        const waitSeconds = (otpCount === 1) ? 30 : otpCount * 60;

        const resendBtn  = document.getElementById('resendBtn');
        const resendText = document.getElementById('resendText');

        function startCountdown() {
            const elapsed   = Math.floor((Date.now() - lastOtpTime) / 1000);
            let remaining   = Math.max(0, waitSeconds - elapsed);

            if (remaining <= 0) return; // Cho phép gửi ngay

            resendBtn.disabled = true;

            const timer = setInterval(function() {
                if (remaining <= 0) {
                    clearInterval(timer);
                    resendBtn.disabled = false;
                    resendText.textContent = 'Gửi lại OTP';
                    return;
                }
                resendText.textContent = 'Gửi lại sau ' + remaining + 's';
                remaining--;
            }, 1000);

            // Cập nhật ngay lập tức lần đầu
            resendText.textContent = 'Gửi lại sau ' + remaining + 's';
            remaining--;
        }

        if (lastOtpTime > 0) startCountdown();
    })();

    // ===== VALIDATE password phía client =====
    document.addEventListener('DOMContentLoaded', function() {
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const resetPasswordForm = document.getElementById('resetPasswordForm');

        if (newPasswordInput && confirmPasswordInput && resetPasswordForm) {
            [newPasswordInput, confirmPasswordInput].forEach(input => {
                input.addEventListener('input', function() { hideAlerts(); });
            });

            newPasswordInput.addEventListener('blur', validatePasswords);
            confirmPasswordInput.addEventListener('blur', validatePasswords);

            resetPasswordForm.addEventListener('submit', function(e) {
                if (!validatePasswords()) {
                    e.preventDefault();
                    return false;
                }
            });

            function validatePasswords() {
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (!newPassword) { showError('Vui lòng nhập mật khẩu mới!'); return false; }
                if (newPassword.length < 8) { showError('Mật khẩu phải có ít nhất 8 ký tự!'); return false; }
                if (newPassword.length > 12) { showError('Mật khẩu không được quá 12 ký tự!'); return false; }
                if (!/[A-Z]/.test(newPassword)) { showError('Mật khẩu phải từ 8-12 ký tự, bao gồm ít nhất 1 chữ hoa, 1 chữ thường, 1 số, có thể chứa ký tự đặc biệt!'); return false; }
                if (!/[a-z]/.test(newPassword)) { showError('Mật khẩu phải từ 8-12 ký tự, bao gồm ít nhất 1 chữ hoa, 1 chữ thường, 1 số, có thể chứa ký tự đặc biệt!'); return false; }
                if (!/\d/.test(newPassword))    { showError('Mật khẩu phải từ 8-12 ký tự, bao gồm ít nhất 1 chữ hoa, 1 chữ thường, 1 số, có thể chứa ký tự đặc biệt!'); return false; }
                if (!confirmPassword) { showError('Vui lòng xác nhận lại mật khẩu!'); return false; }
                if (newPassword !== confirmPassword) { showError('Mật khẩu xác nhận không khớp!'); return false; }

                hideAlerts();
                return true;
            }

            function showError(message) {
                let errorAlert = document.querySelector('.alert-danger');
                if (!errorAlert) {
                    errorAlert = document.createElement('div');
                    errorAlert.className = 'alert alert-danger';
                    errorAlert.innerHTML = `<i class="bi bi-exclamation-circle"></i> <span>${message}</span>`;
                    const form = document.getElementById('resetPasswordForm');
                    form.parentNode.insertBefore(errorAlert, form);
                } else {
                    errorAlert.querySelector('span').textContent = message;
                    errorAlert.style.display = 'block';
                }
            }

            function hideAlerts() {
                const errorAlert = document.querySelector('.alert-danger');
                if (errorAlert) errorAlert.style.display = 'none';
            }
        }
    });
    </script>

</body>
</html>
