<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Customer Support - Staff</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f6fa;
        }

        /* Staff navbar styles được định nghĩa trong header fragment */
        .main-content {
            padding: 40px 0;
            margin-top: 80px; /* Tránh bị header che */
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            color: #2d3436;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d3436;
            margin: 0;
        }

        .stat-card p {
            color: #636e72;
            margin: 0;
            font-size: 0.85rem;
        }

        .ticket-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .ticket-card h3 {
            font-family: 'Playfair Display', serif;
            color: #2d3436;
            margin-bottom: 20px;
        }

        .ticket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .ticket-item:hover {
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .ticket-info h6 {
            margin: 0;
            font-weight: 600;
            color: #2d3436;
        }

        .ticket-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #636e72;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge.open {
            background: #d4edda;
            color: #155724;
        }

        .badge.in_progress {
            background: #fff3cd;
            color: #856404;
        }

        .badge.resolved {
            background: #cce5ff;
            color: #004085;
        }

        @keyframes subtle-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.4);
            }
            70% {
                box-shadow: 0 0 0 5px rgba(0, 123, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 123, 255, 0);
            }
        }

        .btn-reply {
            padding: 8px 15px;
            background: #11998e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-reply:hover {
            background: #0e7c6f;
        }
        
        .filter-btn {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 2px solid #e9ecef;
            background: white;
            color: #6c757d;
            transition: all 0.3s;
            cursor: pointer;
        }

        .filter-btn:hover {
            border-color: #11998e;
            color: #11998e;
        }

        .filter-btn.active {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }
    </style>
</head>
<body>
<!-- Staff Header -->
<div th:replace="~{fragments/header :: staffheader}"></div>
<div class="main-content">
    <div class="container">
        <!-- Hiển thị thông báo -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header"><h1><i class="bi bi-headset"></i> Customer Support Tickets</h1></div>
        <div class="stats-grid">
            <div class="stat-card"><h3 th:text="${openTicketsCount}"></h3>
                <p>Open Tickets</p></div>
            <div class="stat-card"><h3 th:text="${inProgressCount}"></h3>
                <p>In Progress</p></div>
            <div class="stat-card"><h3 th:text="${resolvedTodayCount}"></h3>
                <p>Resolved Today</p></div>
            <div class="stat-card">
                <h3>
                    <span th:if="${avgResponseMinutes > 0}">
                        <span th:if="${avgResponseMinutes < 60}" th:text="${avgResponseMinutes + 'm'}"></span>
                        <span th:if="${avgResponseMinutes >= 60}"
                              th:text="${(avgResponseMinutes / 60) + 'h'}"></span>
                    </span>
                    <span th:if="${avgResponseMinutes == 0}">-</span>
                </h3>
                <p>Avg Response</p>
            </div>
        </div>

        <!-- Filter Section -->
        <div style="
background:white;
border-radius:15px;
padding:20px;
margin-bottom:30px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
border:1px solid #f0f0f0;
">

            <div style="
    display:flex;
    align-items:center;
    justify-content:space-between;
    ">

                <h3 style="
        font-family:'Playfair Display', serif;
        color:#2d3436;
        margin:0;
        ">
                    Bộ lọc trạng thái
                </h3>

                <form th:action="@{/staff/support}" method="get" style="display:flex; gap:8px;">
                    <input type="hidden" name="keyword" th:value="${keyword}">

                    <button type="submit" name="status" value=""
                            class="filter-btn"
                            th:classappend="${status == null or status == ''} ? 'active' : ''">
                        Tất cả
                    </button>

                    <button type="submit" name="status" value="OPEN"
                            class="filter-btn"
                            th:classappend="${status == 'OPEN'} ? 'active' : ''">
                        Mở
                    </button>

                    <button type="submit" name="status" value="IN_PROGRESS"
                            class="filter-btn"
                            th:classappend="${status == 'IN_PROGRESS'} ? 'active' : ''">
                        Đang xử lý
                    </button>

                    <button type="submit" name="status" value="RESOLVED"
                            class="filter-btn"
                            th:classappend="${status == 'RESOLVED'} ? 'active' : ''">
                        Hoàn thành
                    </button>

                    <button type="submit" name="status" value="CLOSED"
                            class="filter-btn"
                            th:classappend="${status == 'CLOSED'} ? 'active' : ''">
                        Đóng
                    </button>

                </form>

            </div>

        </div>




        <!-- Xem Tickets -->
            <div class="col-lg-12">
                <div class="ticket-card">
                    <h3 class="mb-0"><i class="bi bi-ticket-detailed"></i> Tickets được phân công</h3>

                    <!-- Hiển thị danh sách support requests được phân công cho staff -->
                    <div th:if="${assignedRequests != null and !assignedRequests.empty}">
                        <div class="ticket-item" th:each="request : ${assignedRequests}">
                            <div class="ticket-info">
                                <h6 th:text="'Ticket #' + ${request.id} + ' - ' + ${request.title}"></h6>
                                <p th:text="'Khách hàng: ' + ${request.customerName} + ' | Email: ' + ${request.customerEmail} + ' | Tạo: ' + ${#temporals.format(request.createdAt, 'HH:mm dd/MM/yyyy')}">
                                   </p>
                                <small class="text-muted" th:text="${#strings.abbreviate(request.description, 100)}"></small>
                            </div>
                            <div>
                                <span th:class="'badge ' + ${request.status.name().toLowerCase()}"
                                      th:id="'status-' + ${request.id}"
                                      th:text="${request.status.name() == 'OPEN' ? 'Mở' :
                                      request.status.name() == 'IN_PROGRESS' ? 'Đang xử lý' :
                                      request.status.name() == 'RESOLVED' ? 'Hoàn thành' : 'Đóng'}">
                                </span>


                                <a th:href="@{/staff/support/view/{id}(id=${request.id})}" class="btn-reply ms-2">
                                    <i class="bi bi-eye"></i> Xem chi tiết
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Hiển thị khi không có ticket nào được phân công -->
                    <div th:if="${assignedRequests == null or assignedRequests.empty}" class="text-center py-5">
                        <i class="bi bi-inbox display-1 text-muted"></i>
                        <h5 class="text-muted mt-3">Bạn chưa có ticket nào được phân công</h5>
                        <p class="text-muted">Các support request sẽ được hiển thị ở đây khi được phân công cho bạn.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Tự động ẩn thông báo sau 5 giây
    document.addEventListener('DOMContentLoaded', function () {
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 5000);
    });
</script>
</body>
</html>
