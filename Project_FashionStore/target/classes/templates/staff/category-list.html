<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản Lý Danh Mục - Staff</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #C44569;
            --dark-text: #2C3E50;
            --light-bg: #FFF9F9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-bg);
            color: var(--dark-text);
        }

        .staff-container {
            padding: 2rem 0;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
        }

        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .stats-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stats-label {
            color: #666;
            font-size: 0.9rem;
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .table thead th {
            border-bottom: 2px solid var(--primary-color);
            font-weight: 600;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-action {
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div th:replace="~{fragments/header :: staffheader}"></div>

    <div class="staff-container" style="margin-top: 80px;">
        <div class="container-fluid">

            <!-- Title + Add -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="page-title mb-0">Quản Lý Danh Mục</h1>
                <a th:href="@{/staff/categories/create}" class="btn-add">
                    <i class="bi bi-plus-circle me-2"></i>
                    Thêm Danh Mục
                </a>
            </div>


            <!-- Error message -->
            <div th:if="${error}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Table -->
            <div class="table-card">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Danh Sách Danh Mục</h3>
                    <div class="search-container">
                        <form th:action="@{/staff/categories}" method="get" class="d-flex gap-2">
                            <input type="search" name="keyword" class="form-control" style="width: 250px;" 
                                   placeholder="Tìm kiếm danh mục..." th:value="${keyword}">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i> Tìm
                            </button>
                            <a th:href="@{/staff/categories}" class="btn btn-outline-secondary" th:if="${keyword != null}">
                                <i class="bi bi-x-circle"></i> Xóa
                            </a>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên Danh Mục</th>
                                <th class="text-center">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>

                            <tr th:each="c, iter : ${categories}">
                                <!-- STT thay cho ID -->
                                <td th:text="${iter.count}"></td>

                                <td>
                                    <strong th:text="${c.categoryName}"></strong>
                                </td>

                                <td class="text-center">

                                    <!-- Edit -->
                                    <a th:href="@{'/staff/categories/edit/' + ${c.categoryId}}"
                                        class="btn btn-sm btn-primary btn-action">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <!-- Delete -->
                                    <form th:action="@{'/staff/categories/delete/' + ${c.categoryId}}" method="post"
                                        style="display:inline;"
                                        onsubmit="return confirm('Bạn có chắc muốn xoá danh mục này?');">

                                        <button type="submit" class="btn btn-sm btn-danger btn-action">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>

                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="3" class="text-center text-muted">
                                    Không có danh mục nào
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
