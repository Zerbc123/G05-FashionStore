<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - FashionStore</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-color: #FF6B9D; --secondary-color: #C44569; --bg-light: #fcfcfc; --dark-text: #2C3E50; }
        body { background-color: var(--bg-light); padding-top: 100px; font-family: 'Poppins', sans-serif; color: var(--dark-text); }
        .page-title { font-family: 'Playfair Display', serif; font-weight: 700; text-align: center; margin-bottom: 2rem; }
        .checkout-box { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: 1px solid #f1f1f1; margin-bottom: 20px; }
        .section-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid #eee; }
        .form-control { border-radius: 10px; padding: 12px 15px; border: 1px solid #e0e0e0; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(255, 107, 157, 0.25); }

        /* Custom Radio */
        .custom-radio-card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 15px; }
        .form-check-input:checked + .custom-radio-card { border-color: var(--primary-color); background-color: #fff0f5; box-shadow: 0 4px 10px rgba(255, 107, 157, 0.1); }
        .form-check-input { display: none; }
        .radio-circle { width: 20px; height: 20px; border: 2px solid #ccc; border-radius: 50%; display: inline-block; position: relative; }
        .form-check-input:checked + .custom-radio-card .radio-circle::after { content: ''; width: 10px; height: 10px; background: var(--primary-color); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .order-summary-box { position: sticky; top: 100px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #eee; font-weight: 700; font-size: 1.2rem; color: var(--primary-color); }

        .btn-checkout { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; transition: all 0.3s; margin-top: 20px;}
        .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 107, 157, 0.3); }
        .product-mini-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }

        /* Address Display Styles */
        .address-display-section { margin-top: 10px; }
        .current-address-card { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px; 
            background: #f8f9fa; 
            border: 1px solid #e9ecef; 
            border-radius: 10px; 
            transition: all 0.3s ease;
        }
        .current-address-card:hover { 
            border-color: var(--primary-color); 
            box-shadow: 0 2px 8px rgba(255, 107, 157, 0.1); 
        }
        .address-content { 
            display: flex; 
            align-items: center; 
            flex: 1; 
        }
        .address-text { 
            font-size: 0.95rem; 
            color: #333; 
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container mb-5">
    <h2 class="page-title">Thanh Toán</h2>

    <form th:action="@{/cart/checkout/place-order}" method="POST">
        <div class="row">
            <div class="col-lg-8">
                <div class="checkout-box">
                    <h4 class="section-title"><i class="bi bi-geo-alt me-2"></i>Thông Tin Giao Hàng</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Họ và Tên <span class="text-danger">*</span></label>
                            <input type="text" name="fullName" th:value="${fullName}" class="form-control">
                            <small class="text-danger" th:if="${errorFullName}" th:text="${errorFullName}"></small>
                        </div>

                        <div class="col-md-6">
                            <label>Số điện thoại <span class="text-danger">*</span></label>
                            <input type="text" name="phone" th:value="${phone}" class="form-control">
                            <small class="text-danger" th:if="${errorPhone}" th:text="${errorPhone}"></small>
                        </div>

                        <div class="col-12">
                            <label>Địa chỉ nhận hàng <span class="text-danger">*</span></label>
                            <div class="address-display-section">
                                <div class="current-address-card">
                                    <div class="address-content">
                                        <i class="bi bi-geo-alt-fill text-primary me-2"></i>
                                        <span th:text="${address != null ? address : 'Chưa có địa chỉ'}" class="address-text">123 Nguyễn Trãi, Phường Cầu Kho, Quận 1, TP. Hồ Chí Minh</span>
                                    </div>
                                    <button type="button" class="btn btn-outline-primary btn-sm" onclick="changeAddress()">
                                        <i class="bi bi-pencil me-1"></i>Thay đổi
                                    </button>
                                </div>
                                <!-- Hidden field để lưu địa chỉ cuối cùng -->
                                <input type="hidden" name="deliveryAddress" id="deliveryAddress" th:value="${address}" />
                            </div>
                            <small class="text-danger" th:if="${errorAddress}" th:text="${errorAddress}"></small>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted small">Ghi chú cho đơn hàng (Tùy chọn)</label>
                            <textarea class="form-control" name="note" rows="2" placeholder="Giao trong giờ hành chính..." th:text="${note}"></textarea>
                        </div>
                    </div>
                </div>

                <div class="checkout-box">
                    <h4 class="section-title"><i class="bi bi-truck me-2"></i>Phương Thức Giao Hàng</h4>
                    <div class="d-flex flex-column gap-3">
                        <label>
                            <input type="radio" class="form-check-input" name="deliveryMethod" value="standard" checked onchange="updateTotal(30000)">
                            <div class="custom-radio-card">
                                <div class="radio-circle"></div>
                                <div class="flex-grow-1">
                                    <div class="fw-bold">Giao hàng tiêu chuẩn - 30.000đ</div>
                                    <div class="text-muted small">Nhận hàng trong 3-5 ngày làm việc</div>
                                </div>
                            </div>
                        </label>

                        <label>
                            <input type="radio" class="form-check-input" name="deliveryMethod" value="express" onchange="updateTotal(50000)">
                            <div class="custom-radio-card">
                                <div class="radio-circle"></div>
                                <div class="flex-grow-1">
                                    <div class="fw-bold">Giao hàng hỏa tốc - 50.000đ</div>
                                    <div class="text-muted small">Nhận hàng trong 1-2 ngày làm việc</div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="checkout-box">
                    <h4 class="section-title"><i class="bi bi-wallet2 me-2"></i>Phương Thức Thanh Toán</h4>
                    <div class="d-flex flex-column gap-3">
                        <label>
                            <input type="radio" class="form-check-input" name="paymentMethod" value="COD" checked>
                            <div class="custom-radio-card">
                                <div class="radio-circle"></div>
                                <div>
                                    <div class="fw-bold">Thanh toán khi nhận hàng (COD)</div>
                                    <div class="text-muted small">Thanh toán bằng tiền mặt khi shipper giao tới</div>
                                </div>
                            </div>
                        </label>

                        <label>
                            <input type="radio" class="form-check-input" name="paymentMethod" value="BANKING">
                            <div class="custom-radio-card">
                                <div class="radio-circle"></div>
                                <div>
                                    <div class="fw-bold">Chuyển khoản qua ngân hàng (Banking)</div>
                                    <div class="text-muted small">Chuyển khoản qua thẻ ATM / Internet Banking / Momo</div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="checkout-box order-summary-box">
                    <h4 class="section-title">Chi Tiết Đơn Hàng</h4>

                    <div style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;">
                        <div class="d-flex gap-3 mb-3" th:each="item : ${cartItems}">
                            <img th:src="${item.productVariant.imageUrl}" class="product-mini-img" onerror="this.src='https://placehold.co/60'">
                            <div class="flex-grow-1">
                                <div class="fw-bold text-truncate" style="max-width: 180px;" th:text="${item.productVariant.product.productName}">Tên SP</div>
                                <div class="text-muted small">
                                    Size: <span th:text="${item.productVariant.categorySize.sizeName}"></span> |
                                    Màu: <span th:text="${item.productVariant.color.colorName}"></span>
                                </div>
                                <div class="d-flex justify-content-between mt-1">
                                    <span class="text-muted small" th:text="'x' + ${item.quantity}">x1</span>
                                    <span class="fw-bold text-primary" th:text="${#numbers.formatDecimal(item.productVariant.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 mb-3">
                        <label class="form-label fw-bold"><i class="bi bi-ticket-perforated me-2"></i>Mã Giảm Giá</label>
                        <div class="d-flex gap-2">
                            <select id="voucherSelect" class="form-select">
                                <option value="">-- Chọn voucher --</option>
                                <option th:each="voucher : ${validVouchers}" 
                                        th:value="${voucher.code}" 
                                        th:data-discount="${voucher.discountValue}"
                                        th:text="${voucher.code + ' - Giảm ' + #numbers.formatDecimal(voucher.discountValue, 0, 'COMMA', 0, 'POINT') + 'đ'}"></option>
                            </select>
                            <button type="button" onclick="applyVoucher()" class="btn btn-dark" style="white-space: nowrap;">Áp dụng</button>
                        </div>
                        <small id="voucherMessage" class="d-block mt-2 fw-bold"></small>
                    </div>

                    <hr class="text-muted">

                    <div class="summary-item">
                        <span class="text-muted">Tạm tính:</span>
                        <span class="fw-bold" id="subtotal" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                    </div>
                    <div class="summary-item">
                        <span class="text-muted">Phí vận chuyển:</span>
                        <span class="fw-bold" id="shippingFee">30.000đ</span>
                    </div>
                    <div class="summary-item" id="discountRow" style="display: none;">
                        <span class="text-muted">Giảm giá:</span>
                        <span class="fw-bold text-danger" id="discountAmount">-0đ</span>
                    </div>

                    <div class="summary-total">
                        <span>Tổng thanh toán:</span>
                        <span id="totalAmount" th:text="${#numbers.formatDecimal(total + 30000, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                    </div>

                    <!-- Hidden inputs lưu giá trị voucher -->
                    <input type="hidden" name="voucherCode" id="hiddenVoucherCode" value="">
                    <input type="hidden" name="voucherDiscount" id="hiddenVoucherDiscount" value="0">
                    <input type="hidden" name="shippingFee" id="hiddenShippingFee" value="30000">

                    <!-- THÊM DÒNG NÀY: Để gửi tổng tiền cuối cùng lên Server -->
                    <input type="hidden" name="totalAmount" id="hiddenTotalAmount" th:value="${total + 30000}">

                    <button type="submit" class="btn-checkout">ĐẶT HÀNG</button>
                    <div class="text-center mt-3">
                        <a th:href="@{/cart}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Quay lại giỏ hàng</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
console.log('Checkout page loaded!');
const subtotal = /*[[${total}]]*/ 0;
console.log('Subtotal:', subtotal);

function updateTotal(shippingFee) {
    // Cập nhật UI phí ship
    document.getElementById('shippingFee').textContent = shippingFee.toLocaleString('vi-VN') + 'đ';
    // Cập nhật Hidden phí ship
    document.getElementById('hiddenShippingFee').value = shippingFee;

    // Tính lại tổng cuối
    calculateFinalTotal();
}

function changeAddress() {
    console.log('Changing address...');
    window.location.href = '/fashionstore/cart/checkout/select-delivery-address';
}

// Form validation before submit
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form[action="/fashionstore/cart/checkout/place-order"]');
    if (form) {
        form.addEventListener('submit', function(e) {
            console.log('Form submitting...');
            
            // Kiểm tra các trường bắt buộc
            const fullName = document.querySelector('input[name="fullName"]').value.trim();
            const phone = document.querySelector('input[name="phone"]').value.trim();
            const deliveryAddress = document.querySelector('input[name="deliveryAddress"]').value.trim();
            
            console.log('Form data:', { fullName, phone, deliveryAddress });
            
            // Validation cơ bản
            if (!fullName) {
                e.preventDefault();
                alert('Vui lòng nhập họ và tên!');
                return false;
            }
            
            if (!phone) {
                e.preventDefault();
                alert('Vui lòng nhập số điện thoại!');
                return false;
            }
            
            if (!deliveryAddress) {
                e.preventDefault();
                alert('Vui lòng chọn địa chỉ giao hàng!');
                return false;
            }
            
            console.log('Form validation passed, submitting...');
            return true;
        });
    }
});

// Hàm áp dụng voucher
function applyVoucher() {
    const select = document.getElementById('voucherSelect');
    const voucherCode = select.value;
    const messageDiv = document.getElementById('voucherMessage');

    if (!voucherCode) {
        messageDiv.textContent = 'Vui lòng chọn mã voucher!';
        messageDiv.className = 'text-warning';
        return;
    }

    const selectedOption = select.options[select.selectedIndex];
    const discountAmount = parseFloat(selectedOption.getAttribute('data-discount')) || 0;

    // 1. Lưu thông tin voucher vào hidden
    document.getElementById('hiddenVoucherCode').value = voucherCode;
    document.getElementById('hiddenVoucherDiscount').value = discountAmount;

    // 2. Cập nhật UI giảm giá
    document.getElementById('discountRow').style.display = 'flex';
    document.getElementById('discountAmount').textContent = '-' + discountAmount.toLocaleString('vi-VN') + 'đ';

    // 3. Gọi hàm tính lại tổng cuối để cập nhật hiddenTotalAmount
    calculateFinalTotal();

    messageDiv.textContent = 'Áp dụng voucher thành công!';
    messageDiv.className = 'text-success';
}

function calculateFinalTotal() {
    // Lấy giá trị hiện tại từ các hidden inputs
    const shippingFee = parseFloat(document.getElementById('hiddenShippingFee').value) || 0;
    const discount = parseFloat(document.getElementById('hiddenVoucherDiscount').value) || 0;

    // Tính toán
    const finalTotal = subtotal + shippingFee - discount;
    const safeTotal = Math.max(0, finalTotal); // Không để tổng âm

    // Cập nhật hiển thị (UI)
    document.getElementById('totalAmount').textContent = safeTotal.toLocaleString('vi-VN') + 'đ';

    // CẬP NHẬT DỮ LIỆU GỬI ĐI (Server)
    document.getElementById('hiddenTotalAmount').value = safeTotal;
}
</script>

</body>
</html>
