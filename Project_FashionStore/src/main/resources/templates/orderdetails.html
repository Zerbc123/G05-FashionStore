<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>

    <!-- Bootstrap + CSS GIỮ NGUYÊN -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #FFF9F9;
            padding-top: 80px;
        }
        .product-image {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
        }
        .price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #FF6B9D;
        }
        .variant-box {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div class="row">

        <!-- HÌNH SẢN PHẨM -->
        <div class="col-md-6">
            <img th:src="${product.imageUrl}"
                 alt="Product Image"
                 class="product-image">
        </div>

        <!-- THÔNG TIN SẢN PHẨM -->
        <div class="col-md-6">
            <h2 th:text="${product.productName}">Tên sản phẩm</h2>

            <p class="text-muted"
               th:text="'Danh mục: ' + ${product.category.categoryName}">
                Danh mục
            </p>

            <p th:text="${product.description}">
                Mô tả sản phẩm
            </p>

            <hr>

            <h4>Biến thể sản phẩm</h4>

            <!-- LIST PRODUCT VARIANT -->
            <div th:each="variant : ${product.variants}" class="variant-box">

                <div class="row align-items-center">
                    <div class="col-4">
                        <img th:src="${variant.imageUrl}"
                             class="img-fluid rounded">
                    </div>

                    <div class="col-8">
                        <p>
                            <strong>Màu:</strong>
                            <span th:text="${variant.color.colorName}"></span>
                        </p>

                        <p>
                            <strong>Size:</strong>
                            <span th:text="${variant.categorySize.sizeName}"></span>
                        </p>

                        <p>
                            <strong>Số lượng còn:</strong>
                            <span th:text="${variant.quantity}"></span>
                        </p>

                        <div class="price"
                             th:text="${#numbers.formatDecimal(variant.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            0 đ
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
