<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn Địa Chỉ Giao Hàng - FashionStore</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #FF6B9D; --secondary-color: #C44569; --bg-light: #fcfcfc; --dark-text: #2C3E50; }
        body { background-color: var(--bg-light); padding-top: 100px; font-family: 'Poppins', sans-serif; color: var(--dark-text); }
        .page-title { font-family: 'Playfair Display', serif; font-weight: 700; text-align: center; margin-bottom: 2rem; }
        .address-box { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); border: 1px solid #f1f1f1; margin-bottom: 20px; }
        .section-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 2px solid #eee; }
        .form-control, .form-select { border-radius: 10px; padding: 12px 15px; border: 1px solid #e0e0e0; }
        .form-control:focus, .form-select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(255, 107, 157, 0.25); }
        
        .address-option { 
            border: 1px solid #e0e0e0; 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 15px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            position: relative;
        }
        .address-option:hover { 
            border-color: var(--primary-color); 
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.1); 
        }
        .address-option.selected { 
            border-color: var(--primary-color); 
            background: #fff0f5; 
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.15); 
        }
        .address-option.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary-color);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .btn-primary-custom { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 600; transition: all 0.3s; }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 107, 157, 0.3); }
        .btn-secondary-custom { background: #6c757d; color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 600; transition: all 0.3s; }
        .btn-secondary-custom:hover { background: #5a6268; transform: translateY(-2px); }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container mb-5">
    <h2 class="page-title">Chọn Địa Chỉ Giao Hàng</h2>

    <form th:action="@{/cart/checkout/update-delivery-address}" method="POST">
        <!-- Địa chỉ hiện tại từ profile -->
        <div class="address-box">
            <h4 class="section-title"><i class="bi bi-person-check me-2"></i>Địa chỉ mặc định</h4>
            <div class="address-option" onclick="selectAddress('profile')" id="profileAddress">
                <div class="d-flex align-items-start gap-3">
                    <i class="bi bi-geo-alt-fill text-primary mt-1"></i>
                    <div class="flex-grow-1">
                        <div class="fw-bold mb-1">Địa chỉ từ hồ sơ</div>
                        <div class="text-muted" th:text="${currentAddress != null ? currentAddress : 'Chưa có địa chỉ trong hồ sơ'}">
                            123 Nguyễn Trãi, Phường Cầu Kho, Quận 1, TP. Hồ Chí Minh
                        </div>
                    </div>
                </div>
                <input type="radio" name="addressOption" value="profile" checked style="display: none;">
            </div>
        </div>

        <!-- Địa chỉ mới cho đơn hàng này -->
        <div class="address-box">
            <h4 class="section-title"><i class="bi bi-plus-circle me-2"></i>Địa chỉ mới cho đơn hàng này</h4>
            <div class="address-option" onclick="selectAddress('new')" id="newAddress">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tỉnh/Thành phố *</label>
                        <select name="province" class="form-select" id="provinceSelect">
                            <option value="">Chọn tỉnh/thành phố</option>
                            <option value="Hà Nội">Hà Nội</option>
                            <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
                            <option value="Đà Nẵng">Đà Nẵng</option>
                            <option value="Hải Phòng">Hải Phòng</option>
                            <option value="Cần Thơ">Cần Thơ</option>
                            <option value="Bắc Ninh">Bắc Ninh</option>
                            <option value="Bắc Giang">Bắc Giang</option>
                            <option value="Hà Giang">Hà Giang</option>
                            <option value="Hà Nam">Hà Nam</option>
                            <option value="Ninh Bình">Ninh Bình</option>
                            <option value="Ninh Thuận">Ninh Thuận</option>
                            <option value="Quảng Bình">Quảng Bình</option>
                            <option value="Quảng Nam">Quảng Nam</option>
                            <option value="Quảng Ninh">Quảng Ninh</option>
                            <option value="Quảng Trị">Quảng Trị</option>
                            <option value="Tây Ninh">Tây Ninh</option>
                            <option value="Thừa Thiên Huế">Thừa Thiên Huế</option>
                            <option value="Đà Lạt">Đà Lạt</option>
                            <option value="Đắk Lắk">Đắk Lắk</option>
                            <option value="Đắk Nông">Đắk Nông</option>
                            <option value="Điện Biên">Điện Biên</option>
                            <option value="Hậu Giang">Hậu Giang</option>
                            <option value="Lai Châu">Lai Châu</option>
                            <option value="Lâm Đồng">Lâm Đồng</option>
                            <option value="Long An">Long An</option>
                            <option value="Sóc Trăng">Sóc Trăng</option>
                            <option value="Tiền Giang">Tiền Giang</option>
                            <option value="Trà Vinh">Trà Vinh</option>
                            <option value="Vĩnh Long">Vĩnh Long</option>
                            <option value="Vĩnh Phúc">Vĩnh Phúc</option>
                            <option value="Yên Bái">Yên Bái</option>
                            <option value="Bạc Liêu">Bạc Liêu</option>
                            <option value="Bến Tre">Bến Tre</option>
                            <option value="Bình Dương">Bình Dương</option>
                            <option value="Bình Phước">Bình Phước</option>
                            <option value="Bình Thuận">Bình Thuận</option>
                            <option value="Bình Định">Bình Định</option>
                            <option value="Cà Mau">Cà Mau</option>
                            <option value="Đồng Nai">Đồng Nai</option>
                            <option value="Đồng Tháp">Đồng Tháp</option>
                            <option value="Gia Lai">Gia Lai</option>
                            <option value="Kiên Giang">Kiên Giang</option>
                            <option value="Kiên Tường">Kiên Tường</option>
                            <option value="Long An">Long An</option>
                            <option value="An Giang">An Giang</option>
                            <option value="Bà Rịa-Vũng Tàu">Bà Rịa-Vũng Tàu</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Địa chỉ chi tiết *</label>
                        <textarea name="newAddress" class="form-control" rows="3" 
                                  placeholder="Nhập số nhà, tên đường, phường, quận" id="newAddressInput"></textarea>
                        <small class="text-muted">Ví dụ: 123 Nguyễn Trãi, Phường Cầu Kho, Quận 1</small>
                    </div>
                </div>
                <input type="radio" name="addressOption" value="new" style="display: none;">
            </div>
        </div>

        <!-- Hidden field để lưu địa chỉ cuối cùng -->
        <input type="hidden" name="finalAddress" id="finalAddress" />

        <div class="text-center mt-4">
            <button type="submit" class="btn-primary-custom me-3">
                <i class="bi bi-check-circle me-2"></i>Xác nhận địa chỉ
            </button>
            <a th:href="@{/cart/checkout}" class="btn-secondary-custom text-decoration-none">
                <i class="bi bi-arrow-left me-2"></i>Quay lại
            </a>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function selectAddress(type) {
    // Remove selected class from all options
    document.querySelectorAll('.address-option').forEach(option => {
        option.classList.remove('selected');
    });
    
    // Add selected class to clicked option
    if (type === 'profile') {
        document.getElementById('profileAddress').classList.add('selected');
        document.querySelector('input[name="addressOption"][value="profile"]').checked = true;
    } else {
        document.getElementById('newAddress').classList.add('selected');
        document.querySelector('input[name="addressOption"][value="new"]').checked = true;
    }
}

function combineAddress() {
    const province = document.getElementById('provinceSelect').value;
    const address = document.getElementById('newAddressInput').value;
    const finalAddressField = document.getElementById('finalAddress');
    
    if (province && address) {
        const fullAddress = address + ', ' + province;
        finalAddressField.value = fullAddress;
    }
}

// Add event listeners
document.addEventListener('DOMContentLoaded', function() {
    const provinceSelect = document.getElementById('provinceSelect');
    const newAddressInput = document.getElementById('newAddressInput');
    
    if (provinceSelect) {
        provinceSelect.addEventListener('change', combineAddress);
    }
    
    if (newAddressInput) {
        newAddressInput.addEventListener('input', combineAddress);
    }
    
    // Form submit handler
    const form = document.querySelector('form[action="/cart/checkout/update-delivery-address"]');
    if (form) {
        form.addEventListener('submit', function(e) {
            const selectedOption = document.querySelector('input[name="addressOption"]:checked').value;
            
            if (selectedOption === 'profile') {
                // Use current address from profile
                const currentAddress = /*[[${currentAddress}]]*/ '';
                document.getElementById('finalAddress').value = currentAddress;
            } else {
                // Combine new address
                combineAddress();
            }
        });
    }
});
</script>
</body>
</html>
