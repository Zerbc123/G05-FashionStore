<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${category.categoryId == 0} ? 'Add Category' : 'Edit Category'">
        Category Form
    </title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #F4F7FB !important;
            min-height: 100vh;
        }

        .main-content {
            padding: 40px 0;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            color: #2d3436;
            font-size: 2rem;
        }

        .breadcrumb {
            background: none;
            padding: 0;
        }

        .breadcrumb-item a {
            color: #667eea;
            text-decoration: none;
        }

        .edit-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin-bottom: 30px;
        }

        .edit-card h3 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 15px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments/header :: staffheader}"></div>

    <div class="main-content" style="margin-top: 80px;">
        <div class="container">

            <!-- Breadcrumb -->
            <div class="page-header">
                <nav>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/staff/categories}">Categories</a>
                        </li>
                        <li class="breadcrumb-item active"
                            th:text="${category.categoryId == 0} ? 'Add Category' : 'Edit Category'">
                        </li>
                    </ol>
                </nav>

                <h1>
                    <i class="bi bi-folder-plus"></i>
                    <span th:text="${category.categoryId == 0} ? 'Add New Category' : 'Edit Category'"></span>
                </h1>
            </div>

            <!-- Form -->
            <form th:action="@{/staff/categories/save}" th:object="${category}" method="post">

                <input type="hidden" th:field="*{categoryId}" />

                <div class="edit-card">
                    <h3>Category Information</h3>

                    <div class="mb-3">
                        <label class="form-label">Category Name *</label>
                        <input type="text" class="form-control" th:field="*{categoryName}"
                            placeholder="Enter category name" required>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i>
                        <span th:text="${category.categoryId == 0} ? 'Create Category' : 'Update Category'"></span>
                    </button>

                    <a th:href="@{/staff/categories}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i>
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
