<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Product Image - FashionStore</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <style>
        .upload-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: #f8f9fa;
        }
        .upload-area.dragover {
            border-color: var(--primary-color);
            background-color: #e3f2fd;
        }
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .loading {
            display: none;
        }
        .success-message {
            display: none;
            color: #28a745;
            font-weight: 600;
            margin-top: 15px;
        }
        .error-message {
            display: none;
            color: #dc3545;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-container">
            <h3 class="text-center mb-4">
                <i class="bi bi-cloud-upload me-2"></i>
                Upload Product Image
            </h3>
            
            <div class="upload-area" id="uploadArea">
                <i class="bi bi-image" style="font-size: 3rem; color: #6c757d;"></i>
                <h5 class="mt-3">Drag & Drop Image Here</h5>
                <p class="text-muted">or click to browse</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <button class="btn btn-primary mt-3" onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-folder-open me-2"></i>Choose File
                </button>
            </div>
            
            <div id="previewContainer" style="display: none;">
                <h5 class="mt-4">Preview:</h5>
                <img id="previewImage" class="preview-image">
            </div>
            
            <div class="loading" id="loading">
                <div class="text-center mt-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Uploading to Cloudinary...</p>
                </div>
            </div>
            
            <div class="success-message" id="successMessage">
                <i class="bi bi-check-circle me-2"></i>
                Image uploaded successfully!
            </div>
            
            <div class="error-message" id="errorMessage">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span id="errorText">Upload failed!</span>
            </div>
            
            <div class="mt-4" id="resultContainer" style="display: none;">
                <h5>Image URL:</h5>
                <div class="input-group">
                    <input type="text" id="imageUrl" class="form-control" readonly>
                    <button class="btn btn-outline-secondary" onclick="copyUrl()">
                        <i class="bi bi-clipboard"></i> Copy
                    </button>
                </div>
                <button class="btn btn-success mt-3" onclick="saveToProduct()">
                    <i class="bi bi-save me-2"></i>Save to Product
                </button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const resultContainer = document.getElementById('resultContainer');
        const imageUrlInput = document.getElementById('imageUrl');
        
        let uploadedUrl = '';
        const productId = /*[[${productId}]]*/ null;
        
        // Drag and drop events
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Please select a valid image file');
                return;
            }
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            // Upload file
            uploadImage(file);
        }
        
        function uploadImage(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            loading.style.display = 'block';
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            resultContainer.style.display = 'none';
            
            fetch('/fashionstore/api/upload/product-image', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                
                if (data.url) {
                    uploadedUrl = data.url;
                    imageUrlInput.value = uploadedUrl;
                    successMessage.style.display = 'block';
                    resultContainer.style.display = 'block';
                } else {
                    showError(data.error || 'Upload failed');
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                showError('Upload failed: ' + error.message);
            });
        }
        
        function showError(message) {
            errorText.textContent = message;
            errorMessage.style.display = 'block';
        }
        
        function copyUrl() {
            imageUrlInput.select();
            document.execCommand('copy');
            
            // Show temporary success message
            const button = event.target;
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="bi bi-check"></i> Copied!';
            button.classList.remove('btn-outline-secondary');
            button.classList.add('btn-success');
            
            setTimeout(() => {
                button.innerHTML = originalText;
                button.classList.remove('btn-success');
                button.classList.add('btn-outline-secondary');
            }, 2000);
        }
        
        function saveToProduct() {
            if (!uploadedUrl || !productId) {
                showError('Cannot save: missing product ID or image URL');
                return;
            }
            
            // Here you would typically make an API call to update the product
            // For now, we'll just show the URL that needs to be saved
            alert(`Save this URL to product ${productId}: ${uploadedUrl}`);
        }
    </script>
</body>
</html>
