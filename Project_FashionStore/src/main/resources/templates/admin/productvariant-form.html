<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Cập Nhật Biến Thể' : 'Thêm Biến Thể Mới'}">Biến Thể Sản Phẩm</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #C44569;
            --dark-text: #2C3E50;
            --light-bg: #FFF9F9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark-text);
            background-color: var(--light-bg);
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 1rem 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: white !important;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            margin: 0 0.5rem;
        }

        .nav-link:hover {
            color: white !important;
        }

        .admin-container {
            padding: 2rem 0;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 157, 0.25);
        }

        .btn-back {
            background: #6c757d;
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-back:hover {
            background: #5a6268;
            color: white;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        .preview-image {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e9ecef;
        }

        .required-star {
            color: var(--primary-color);
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- Admin Header -->
    <div th:replace="~{fragments/header :: adminheader}"></div>

    <div class="admin-container" style="margin-top: 80px;">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="page-title mb-0" th:text="${isEdit ? 'Cập Nhật Biến Thể' : 'Thêm Biến Thể Mới'}">Biến Thể Sản Phẩm</h1>
                <a th:href="@{/admin/product-variants}" class="btn-back">
                    <i class="bi bi-arrow-left me-2"></i>Quay Lại
                </a>
            </div>

            <!-- Alert Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form -->
            <div class="form-card">
                <form th:action="${isEdit ? '/admin/product-variants/update/' + variant.variantId : '/admin/product-variants/save'}" 
                      method="post" th:object="${variant}">
                    
                    <!-- Product Information Section -->
                    <div class="form-section">
                        <h5 class="form-section-title">
                            <i class="bi bi-box me-2"></i>Thông Tin Sản Phẩm
                        </h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="productId" class="form-label">
                                    Sản Phẩm <span class="required-star">*</span>
                                </label>
                                <select class="form-select" id="productId" name="productId" th:field="*{product.productId}" required>
                                    <option value="">-- Chọn sản phẩm --</option>
                                    <option th:each="product : ${products}" 
                                            th:value="${product.productId}" 
                                            th:text="${product.productName}"
                                            th:selected="${variant != null and variant.product != null and variant.product.productId == product.productId}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="colorId" class="form-label">
                                    Màu Sắc <span class="required-star">*</span>
                                </label>
                                <select class="form-select" id="colorId" name="colorId" th:field="*{color.colorId}" required>
                                    <option value="">-- Chọn màu sắc --</option>
                                    <option th:each="color : ${colors}" 
                                            th:value="${color.colorId}" 
                                            th:text="${color.colorName}"
                                            th:selected="${variant != null and variant.color != null and variant.color.colorId == color.colorId}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="categorySizeId" class="form-label">
                                    Kích Cỡ <span class="required-star">*</span>
                                </label>
                                <select class="form-select" id="categorySizeId" name="categorySizeId" th:field="*{categorySize.categorySizeId}" required>
                                    <option value="">-- Chọn kích cỡ --</option>
                                    <option th:each="size : ${categorySizes}" 
                                            th:value="${size.categorySizeId}" 
                                            th:text="${size.sizeName}"
                                            th:selected="${variant != null and variant.categorySize != null and variant.categorySize.categorySizeId == size.categorySizeId}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="stock" class="form-label">
                                    Số Lượng Tồn Kho <span class="required-star">*</span>
                                </label>
                                <input type="number" class="form-control" id="stock" name="stock" 
                                       th:field="*{stock}" min="0" required>
                            </div>
                        </div>
                    </div>

                    <!-- Pricing Information Section -->
                    <div class="form-section">
                        <h5 class="form-section-title">
                            <i class="bi bi-tag me-2"></i>Thông Tin Giá
                        </h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">
                                    Giá (VNĐ) <span class="required-star">*</span>
                                </label>
                                <input type="number" class="form-control" id="price" name="price" 
                                       th:field="*{price}" min="0" step="1000" required>
                            </div>
                        </div>
                    </div>

                    <!-- Media Section -->
                    <div class="form-section">
                        <h5 class="form-section-title">
                            <i class="bi bi-image me-2"></i>Hình Ảnh
                        </h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="imageUrl" class="form-label">
                                    URL Hình Ảnh
                                </label>
                                <input type="url" class="form-control" id="imageUrl" name="imageUrl" 
                                       th:field="*{imageUrl}" placeholder="https://example.com/image.jpg">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Xem Trước</label>
                                <div class="mt-2">
                                    <img th:if="${variant != null and variant.imageUrl != null and !variant.imageUrl.isEmpty()}" 
                                         th:src="${variant.imageUrl}" 
                                         alt="Product Image" 
                                         class="preview-image"
                                         onerror="this.src='https://via.placeholder.com/200x200/cccccc/000000?text=Error'">
                                    <div th:unless="${variant != null and variant.imageUrl != null and !variant.imageUrl.isEmpty()}" 
                                         class="text-center p-3 border rounded" style="border-color: #e9ecef !important;">
                                        <i class="bi bi-image fa-3x text-muted"></i>
                                        <p class="text-muted mt-2 mb-0">Chưa có hình ảnh</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="row">
                        <div class="col-12">
                            <div class="d-flex justify-content-end gap-3">
                                <a th:href="@{/admin/product-variants}" class="btn-back">
                                    <i class="bi bi-x-circle me-2"></i>Hủy
                                </a>
                                <button type="submit" class="btn-submit">
                                    <i class="bi bi-check-circle me-2"></i>
                                    <span th:text="${isEdit ? 'Cập Nhật' : 'Thêm Mới'}">Lưu</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Format price display
        document.addEventListener('DOMContentLoaded', function() {
            const priceInput = document.getElementById('price');
            if (priceInput) {
                priceInput.addEventListener('blur', function() {
                    const value = parseFloat(this.value);
                    if (!isNaN(value)) {
                        this.value = value.toFixed(0);
                    }
                });
            }

            // Image preview
            const imageUrlInput = document.getElementById('imageUrl');
            if (imageUrlInput) {
                imageUrlInput.addEventListener('input', function() {
                    const url = this.value.trim();
                    const previewContainer = document.querySelector('.preview-image').parentElement;
                    
                    if (url) {
                        previewContainer.innerHTML = `
                            <img src="${url}" alt="Product Image" class="preview-image"
                                 onerror="this.src='https://via.placeholder.com/200x200/cccccc/000000?text=Error'">
                        `;
                    } else {
                        previewContainer.innerHTML = `
                            <div class="text-center p-3 border rounded" style="border-color: #e9ecef !important;">
                                <i class="bi bi-image fa-3x text-muted"></i>
                                <p class="text-muted mt-2 mb-0">Chưa có hình ảnh</p>
                            </div>
                        `;
                    }
                });
            }
        });
    </script>
</body>
</html>
