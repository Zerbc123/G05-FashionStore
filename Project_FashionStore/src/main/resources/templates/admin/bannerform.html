<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Banner - Admin</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
</head>
<body class="bg-light" style="padding-top: 100px;">

<div th:replace="~{fragments/header :: adminheader}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm rounded-4 border-0">
                <div class="card-header bg-primary text-white rounded-top-4 py-3">
                    <h4 class="mb-0 fw-bold" th:text="${banner.bannerId == null ? 'Thêm Banner Mới' : 'Cập Nhật Banner'}">Form Banner</h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/admin/banners/save}" th:object="${banner}" method="post" enctype="multipart/form-data">

                        <input type="hidden" th:field="*{bannerId}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiêu đề Banner</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="Ví dụ: Bộ sưu tập mùa Hè 2026">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Upload Hình ảnh Banner <span class="text-danger">*</span></label>
                            <input type="file" name="imageFile" class="form-control" accept="image/*" id="imageFile">
                            <small class="text-muted">Chọn file ảnh từ máy tính (JPG, PNG, GIF, WebP). Kích thước đề xuất: 1920x600 pixels.</small>
                            
                            <!-- Image preview for existing banner -->
                            <div th:if="${banner.imageUrl != null and !#strings.isEmpty(banner.imageUrl)}" class="mt-3">
                                <label class="form-label fw-bold">Ảnh hiện tại:</label>
                                <div class="border rounded p-2">
                                    <img th:src="${banner.imageUrl}" alt="Banner Image" class="img-fluid" style="max-height: 200px; width: auto;">
                                    <input type="hidden" th:field="*{imageUrl}">
                                </div>
                                <small class="text-info">Nếu không chọn ảnh mới, ảnh hiện tại sẽ được giữ nguyên.</small>
                            </div>
                            
                            <!-- Preview for new image -->
                            <div id="imagePreview" class="mt-3" style="display: none;">
                                <label class="form-label fw-bold">Xem trước ảnh mới:</label>
                                <div class="border rounded p-2">
                                    <img id="previewImg" src="#" alt="Preview" class="img-fluid" style="max-height: 200px; width: auto;">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Link đích (Khi khách click vào ảnh)</label>
                            <input type="text" th:field="*{targetLink}" class="form-control" placeholder="Ví dụ: /products/category/1">
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Thứ tự hiển thị</label>
                                <input type="number" th:field="*{displayOrder}" class="form-control" min="0" placeholder="Số nhỏ xếp trước (0, 1, 2...)">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Trạng thái</label>
                                <select th:field="*{isActive}" class="form-select">
                                    <option value="true">Bật (Hiển thị ra trang chủ)</option>
                                    <option value="false">Tắt (Lưu tạm, chưa hiển thị)</option>
                                </select>
                            </div>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/admin/banners}" class="btn btn-secondary px-4 rounded-pill">Quay Lại</a>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill fw-bold">Lưu Banner</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Image preview functionality
    document.getElementById('imageFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const preview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        } else {
            preview.style.display = 'none';
        }
    });
</script>
</body>
</html>
