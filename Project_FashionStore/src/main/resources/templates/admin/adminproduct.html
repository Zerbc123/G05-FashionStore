<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm - Admin</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #C44569;
            --dark-text: #2C3E50;
            --light-bg: #FFF9F9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark-text);
            background-color: var(--light-bg);
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 1rem 0;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: white !important;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            margin: 0 0.5rem;
        }

        .nav-link:hover {
            color: white !important;
        }

        .admin-container {
            padding: 2rem 0;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .stats-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stats-label {
            color: #666;
            font-size: 0.9rem;
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom: 2px solid var(--primary-color);
            font-weight: 600;
        }

        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .badge-stock {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-in-stock {
            background: #d4edda;
            color: #155724;
        }

        .badge-low-stock {
            background: #fff3cd;
            color: #856404;
        }

        .badge-out-stock {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-action {
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin: 0 0.2rem;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-outline-primary {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-outline-primary:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        /* Filter Section */
        .filter-section {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
        }

        .filter-section h4 {
            color: var(--dark-text);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .btn-filter {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-filter:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
            color: white;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .page-item .page-link {
            padding: 0.5rem 1rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            text-decoration: none;
            color: #636e72;
            transition: all 0.3s;
        }

        .page-item .page-link:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .page-item.active .page-link {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-color: var(--primary-color);
        }

        .page-item.disabled .page-link {
            color: #dee2e6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <!-- Admin Header -->
    <div th:replace="~{fragments/header :: adminheader}"></div>

    <div class="admin-container" style="margin-top: 80px;">
        <div class="container-fluid">
            <!-- Alert Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="page-title mb-0">Quản Lý Sản Phẩm</h1>
                <div class="d-flex gap-2">
                    <a th:href="@{/products/admin/add}" class="btn-add" style="text-decoration: none;">
                        <i class="bi bi-plus-circle me-2"></i>Thêm Sản Phẩm
                    </a>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-value" th:text="${totalProducts}">0</div>
                        <div class="stats-label">Tổng sản phẩm</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-value" th:text="${inStockCount}">0</div>
                        <div class="stats-label">Còn hàng</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-value" th:text="${lowStockCount}">0</div>
                        <div class="stats-label">Sắp hết</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stats-card">
                        <div class="stats-value" th:text="${outOfStockCount}">0</div>
                        <div class="stats-label">Hết hàng</div>
                    </div>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <h4><i class="bi bi-funnel"></i> Bộ Lọc Tìm Kiếm</h4>
                <div class="row align-items-end">
                    <div class="col-md-4">
                        <label class="form-label"><i class="bi bi-search"></i> Tìm Kiếm</label>
                        <input type="text" class="form-control" placeholder="Tìm theo tên sản phẩm..." id="searchInput" th:value="${search}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label"><i class="bi bi-tag"></i> Danh Mục</label>
                        <select class="form-select" id="categoryFilter">
                            <option value="all">Tất cả danh mục</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat}" 
                                    th:text="${cat}"
                                    th:selected="${cat == category}">Category Name</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label"><i class="bi bi-filter"></i> Trạng Thái Kho</label>
                        <select class="form-select" id="stockFilter">
                            <option value="all" th:selected="${stockStatus == 'all'}">Tất cả</option>
                            <option value="in-stock" th:selected="${stockStatus == 'in-stock'}">Còn hàng (>20)</option>
                            <option value="low-stock" th:selected="${stockStatus == 'low-stock'}">Sắp hết (1-20)</option>
                            <option value="out-stock" th:selected="${stockStatus == 'out-stock'}">Hết hàng (0)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-filter w-100" onclick="applyFilters()">
                            <i class="bi bi-funnel-fill"></i> Lọc
                        </button>
                    </div>
                </div>
            </div>

            <div class="table-card">

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Hình ảnh</th>
                                <th>Tên sản phẩm</th>
                                <th>Danh mục</th>
                                <th>Giá</th>
                                <th>Tồn kho</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">

                                <td>
                                    <img th:if="${product.variants != null and !product.variants.empty}"
                                        th:src="${product.variants[0].imageUrl}" class="product-img"
                                        th:alt="${product.productName}"
                                        onerror="this.src='https://via.placeholder.com/60x60/cccccc/000000?text=Error'"
                                        loading="lazy">
                                    <img th:unless="${product.variants != null and !product.variants.empty}"
                                        src="https://via.placeholder.com/60x60/cccccc/000000?text=No+Image"
                                        class="product-img" th:alt="${product.productName}">
                                </td>

                                <td>
                                    <strong th:text="${product.productName}"></strong>
                                </td>

                                <td th:text="${product.category != null ? product.category.categoryName : 'N/A'}"></td>

                                <td>
                                    <strong th:if="${product.variants != null and !product.variants.empty}"
                                        th:text="${#numbers.formatDecimal(product.variants[0].price, 0, 'COMMA', 0, 'POINT') + 'đ'}">
                                    </strong>
                                    <strong th:unless="${product.variants != null and !product.variants.empty}">
                                        N/A
                                    </strong>
                                </td>

                                <td th:text="${product.getTotalStock()}">0</td>

                                <td>
                                    <span th:if="${product.getTotalStock() > 20}" class="badge-stock badge-in-stock">
                                        Còn hàng
                                    </span>
                                    <span th:if="${product.getTotalStock() <= 20 and product.getTotalStock() > 0}"
                                        class="badge-stock badge-low-stock">
                                        Sắp hết
                                    </span>
                                    <span th:if="${product.getTotalStock() == 0}" class="badge-stock badge-out-stock">
                                        Hết hàng
                                    </span>
                                </td>

                                <td>
                                    <a th:href="@{/products/variants(productId=${product.productId})}"
                                        class="btn btn-sm btn-info btn-action">
                                        <i class="bi bi-eye me-1"></i>Xem BT
                                    </a>

                                    <a th:href="@{/admin/edit(id=${product.productId})}"
                                        class="btn btn-sm btn-primary btn-action">
                                        Sửa
                                    </a>
                                </td>

                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1}, search=${search}, category=${category}, stockStatus=${stockStatus})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${i == currentPage ? 'active' : ''}">
                            <a class="page-link" th:href="@{/admin/products(page=${i}, search=${search}, category=${category}, stockStatus=${stockStatus})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1}, search=${search}, category=${category}, stockStatus=${stockStatus})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        function applyFilters() {
            const search = document.getElementById('searchInput').value.trim();
            const category = document.getElementById('categoryFilter').value;
            const stockStatus = document.getElementById('stockFilter').value;
            
            let url = [[@{/admin/products}]];
            const params = [];
            
            if (search) params.push('search=' + encodeURIComponent(search));
            if (category !== 'all') params.push('category=' + encodeURIComponent(category));
            if (stockStatus !== 'all') params.push('stockStatus=' + encodeURIComponent(stockStatus));
            
            params.push('page=0'); // Reset to first page
            
            if (params.length > 0) {
                url += '?' + params.join('&');
            }
            
            window.location.href = url;
        }

        // Search on Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                applyFilters();
            }
        });
    </script>
</body>

</html>
