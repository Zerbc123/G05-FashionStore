<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FashionStore Admin - Quản Lý Hỗ Trợ Khách Hàng</title>



    <!-- Bootstrap CSS -->

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">



    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>



    <!-- FontAwesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">



    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        primary: {

                            DEFAULT: '#F06292',

                            light: '#F48FB1',

                        },

                        secondary: {

                            bg: '#FFF5F7',

                        },

                        text: {

                            main: '#2F2F2F',

                            muted: '#7A7A7A',

                        },

                        divider: '#EAEAEA',

                        success: '#C8E6C9',

                        danger: '#F8D7DA',

                        warning: '#FFF3CD'

                    },

                    fontFamily: {

                        heading: ['"Playfair Display"', 'serif'],

                        body: ['"Poppins"', 'sans-serif'],

                    },

                    boxShadow: {

                        'soft': '0 6px 18px rgba(0,0,0,0.06)',

                    },

                    backgroundImage: {

                        'admin-gradient': 'linear-gradient(90deg, #F06292 0%, #F48FB1 100%)',

                    }

                }

            }

        }

        // Function to change page size
        function changePageSize(pageSize) {
            const url = new URL(window.location);
            url.searchParams.set('size', pageSize);
            url.searchParams.set('page', '0'); // Reset to first page when changing size
            window.location.href = url.toString();
        }

    </script>



    <style>

        body { font-family: 'Poppins', sans-serif; background-color: #FAF3F3; color: #2F2F2F; }

        h1, h2, h3 { font-family: 'Playfair Display', serif; }



        .table-container {

            background: white;

            border-radius: 16px;

            box-shadow: 0 6px 18px rgba(0,0,0,0.06);

            overflow: hidden;

        }



        .status-badge {

            padding: 4px 12px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 600;

        }



        .filter-btn {

            padding: 6px 16px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: 500;

            border: 2px solid #EAEAEA;

            background: white;

            color: #7A7A7A;

            transition: all 0.3s;

            cursor: pointer;

        }



        .filter-btn:hover {

            border-color: #F06292;

            color: #F06292;

        }



        .filter-btn.active {

            background: #F06292;

            color: white;

            border-color: #F06292;

        }

    </style>

</head>

<body class="flex flex-col min-h-screen">



<!-- Admin Header -->

<div th:replace="~{fragments/header :: adminheader}"></div>



<div style="margin-top: 80px;">



<main class="flex-grow p-8 max-w-[1320px] mx-auto w-full">



    <!-- Success Message Display -->
    <div th:if="${successMessage}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm flex items-center gap-2">
        <i class="fa-solid fa-check-circle"></i>
        <span th:text="${successMessage}">Success message</span>
    </div>

    <!-- Error Message Display -->
    <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
        <i class="fa-solid fa-exclamation-triangle"></i>
        <span th:text="${errorMessage}">Error message</span>
    </div>



    <!-- Page Header Section -->

    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">

        <div>

            <h1 class="text-3xl font-heading font-bold text-text-main">Quản Lý Hỗ Trợ Khách Hàng</h1>

            <div class="w-12 h-1 bg-primary mt-2"></div>

        </div>



        <div class="flex items-center gap-3">

            <form th:action="@{/admin/support}" method="get" class="relative">

                <input type="text" 

                       name="keyword" 

                       th:value="${keyword}"

                       placeholder="Tìm kiếm yêu cầu hỗ trợ..." 

                       class="pl-10 pr-4 py-2.5 rounded-xl border border-divider focus:outline-none focus:border-primary w-64 text-sm transition shadow-sm">

                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-text-muted text-xs"></i>

            </form>

        </div>

    </div>



    <!-- Filter Section -->

    <div class="bg-white rounded-xl p-6 mb-6 shadow-sm border border-divider">

        <div class="flex items-center justify-between mb-4">

            <h3 class="text-lg font-semibold text-text-main">Bộ lọc trạng thái</h3>

            <form th:action="@{/admin/support}" method="get" class="flex gap-2">

                <input type="hidden" name="keyword" th:value="${keyword}">

                <button type="submit" name="status" value="" 

                        class="filter-btn"

                        th:classappend="${status == null or status == ''} ? 'active' : ''">

                    Tất cả

                </button>

                <button type="submit" name="status" value="OPEN" 

                        class="filter-btn"

                        th:classappend="${status == 'OPEN'} ? 'active' : ''">

                    <i class="fas fa-circle text-green-500 text-xs mr-1"></i> Mở

                </button>

                <button type="submit" name="status" value="IN_PROGRESS" 

                        class="filter-btn"

                        th:classappend="${status == 'IN_PROGRESS'} ? 'active' : ''">

                    <i class="fas fa-circle text-yellow-500 text-xs mr-1"></i> Đang xử lý

                </button>

                <button type="submit" name="status" value="RESOLVED" 

                        class="filter-btn"

                        th:classappend="${status == 'RESOLVED'} ? 'active' : ''">
                    <i class="fas fa-circle text-blue-500 text-xs mr-1"></i> Hoàn thành
                </button>
            </form>
        </div>
    </div>



    <!-- Support Table Container -->

    <div class="table-container">

        <table class="w-full text-left border-collapse">

            <thead>

            <tr class="border-b-2 border-primary/20 bg-secondary-bg/30">

                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">ID</th>

                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">Khách hàng</th>

                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">Tiêu đề</th>

                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">Loại</th>

                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">Trạng thái</th>

                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider">Ngày</th>

                <th class="px-6 py-5 text-sm font-bold text-text-main uppercase tracking-wider text-right">Hành động</th>

            </tr>

            </thead>

            <tbody class="divide-y divide-divider">
            <tr class="hover:bg-secondary-bg/50 transition-colors group" th:each="request : ${supportRequests}">

                <td class="px-6 py-4">
                    <span class="font-mono text-xs font-bold text-primary" th:text="'#SUP-' + ${request.id}">#SUP-001</span>
                </td>

                <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold text-xs" 
                             th:text="${request.customerName != null ? #strings.substring(request.customerName,0,1) : 'K'}">K</div>
                        <div>
                            <span class="text-sm font-medium text-text-main block" th:text="${request.customerName != null ? request.customerName : 'Khách hàng'}">Khách hàng</span>
                            <span class="text-xs text-text-muted" th:text="${request.customerEmail != null ? request.customerEmail : 'customer@example.com'}">customer@example.com</span>
                        </div>
                    </div>
                </td>

                <td class="px-6 py-4">
                    <div class="text-sm font-medium text-text-main" th:text="${request.title}">Tiêu đề yêu cầu</div>
                    <div class="text-xs text-text-muted mt-1" th:text="${#strings.abbreviate(request.description, 50)}">Mô tả ngắn...</div>
                </td>

                <td class="px-6 py-4">
                    <span class="px-2 py-1 bg-purple-100 text-purple-700 text-xs font-medium rounded-full">Hỗ trợ</span>
                </td>

                <td class="px-6 py-4 text-center">
    <span class="status-badge"
          th:classappend="${request.status.name()} == 'OPEN' ? 'bg-green-100 text-green-700' :
                         (${request.status.name()} == 'IN_PROGRESS' ? 'bg-yellow-100 text-yellow-700' :
                         (${request.status.name()} == 'RESOLVED' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-700'))"
          th:text="${request.status.name() == 'OPEN' ? 'Mở' :
                    request.status.name() == 'IN_PROGRESS' ? 'Đang xử lý' :
                    request.status.name() == 'RESOLVED' ? 'Hoàn thành' : 'Đóng'}">
    </span>
                </td>

                <td class="px-6 py-4 text-sm text-text-muted" 
                    th:text="${#temporals.format(request.createdAt, 'dd/MM/yyyy')}">02/03/2024</td>

                <td class="px-6 py-4 text-right space-x-2">
                    <a th:href="@{'/admin/support/view/' + ${request.id}}"
                       class="px-3 py-1.5 bg-white border border-primary text-primary text-xs font-bold rounded-lg hover:bg-primary hover:text-white transition shadow-sm inline-block no-underline">Xem</a>
                    
                    <form th:action="@{'/admin/support/update-status/' + ${request.id}}" method="post" style="display: inline;">
                        <input type="hidden" name="status" value="IN_PROGRESS">
                        <button type="submit" 
                                class="px-3 py-1.5 bg-white border border-yellow-500 text-yellow-600 text-xs font-bold rounded-lg hover:bg-yellow-500 hover:text-white transition shadow-sm"
                                th:if="${request.status == 'OPEN'}">Xử lý</button>
                    </form>

                    <form th:action="@{'/admin/support/update-status/' + ${request.id}}" method="post" style="display: inline;">
                        <input type="hidden" name="status" value="RESOLVED">
                        <button type="submit" 
                                class="px-3 py-1.5 bg-white border border-green-600 text-green-700 text-xs font-bold rounded-lg hover:bg-green-600 hover:text-white transition shadow-sm"
                                th:if="${request.status == 'IN_PROGRESS'}">Hoàn thành</button>
                    </form>
                    <form th:action="@{'/admin/support/update-status/' + ${request.id}}" method="post" style="display: inline;">
                        <input type="hidden" name="status" value="CLOSED">
                        <button type="submit" 
                                class="px-3 py-1.5 bg-white border border-gray-500 text-gray-600 text-xs font-bold rounded-lg hover:bg-gray-500 hover:text-white transition shadow-sm"
                                th:if="${request.status == 'RESOLVED'}">Đóng</button>
                    </form>


                    <form th:action="@{'/admin/support/delete/' + ${request.id}}" method="post" style="display: inline;" 
                          onsubmit="return confirm('Bạn có chắc muốn xóa yêu cầu này?');"
                          th:if="${isAdmin and request.status == 'CLOSED'}">
                        <button type="submit" 
                                class="px-3 py-1.5 bg-white border border-red-500 text-red-600 text-xs font-bold rounded-lg hover:bg-red-500 hover:text-white transition shadow-sm">Xóa</button>
                    </form>
                </td>

            </tr>
            </tbody>

        </table>



        <!-- Pagination Section -->
        <div class="px-6 py-5 flex items-center justify-center bg-white">

            <div class="flex items-center gap-2">

                <!-- Previous -->
                <a th:if="${currentPage > 0}"
                   th:href="@{/admin/support(page=${currentPage - 1}, keyword=${keyword}, status=${status})}"
                   class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted hover:bg-secondary-bg transition no-underline">
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </a>

                <button th:unless="${currentPage > 0}"
                        class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted opacity-50 cursor-not-allowed"
                        disabled>
                    <i class="fa-solid fa-chevron-left text-[10px]"></i>
                </button>


                <!-- Page Numbers -->
                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">

                    <a th:if="${i != currentPage}"
                       th:href="@{/admin/support(page=${i}, keyword=${keyword}, status=${status})}"
                       class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted hover:bg-secondary-bg transition text-xs font-bold no-underline"
                       th:text="${i + 1}">1</a>

                    <button th:unless="${i != currentPage}"
                            class="w-8 h-8 rounded-lg flex items-center justify-center bg-primary text-white text-xs font-bold shadow-sm"
                            th:text="${i + 1}">1</button>

                </th:block>


                <!-- Next -->
                <a th:if="${currentPage < totalPages - 1}"
                   th:href="@{/admin/support(page=${currentPage + 1}, keyword=${keyword}, status=${status})}"
                   class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted hover:bg-secondary-bg transition no-underline">
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </a>

                <button th:unless="${currentPage < totalPages - 1}"
                        class="w-8 h-8 rounded-lg flex items-center justify-center border border-divider text-text-muted opacity-50 cursor-not-allowed"
                        disabled>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>

            </div>

        </div>

    </div>



</main>



<footer class="py-6 border-t border-divider bg-white text-center mt-auto">

    <p class="text-[10px] text-text-muted font-bold uppercase tracking-widest">FashionStore Admin Console &copy; 2024</p>

</footer>



</div>

</body>

</html>
